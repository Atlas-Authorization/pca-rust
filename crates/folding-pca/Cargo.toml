[package]
name = "pca-folding-ivc"
version = "0.2.0"
edition = "2021"
description = "Recursive PCA action-history aggregation via a Nova folding scheme (IVC): fold N per-action steps into ONE RecursiveSNARK, then compress to a CompressedSNARK proving an agent's WHOLE action history (unforgeable hash chain + cumulative Σcost ≤ bMax)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Atlas-Authorization/pca-rust"
homepage = "https://github.com/Atlas-Authorization/pca-rust"
documentation = "https://docs.rs/pca-folding-ivc"
keywords = ["nova","folding","ivc","zero-knowledge","pca"]
categories = ["cryptography"]
exclude = ["fixtures/","/.gitignore","rust-toolchain.toml"]

[dependencies]
# Microsoft Nova (the maintained `nova-snark` line on crates.io). Folding / IVC over a
# cycle of curves. Pinned exact — the 0.76 API (single-circuit `nova::{PublicParams,
# RecursiveSNARK, CompressedSNARK}`, bellpepper vendored as `nova_snark::frontend`).
nova-snark = "=0.76.0"

# `ff` is Nova's field-trait crate. Must track Nova's own ff major.minor so the engine
# scalar's `PrimeField` impl unifies (0.76 uses ff 0.13).
ff = "0.13"

# `generic-array` only to name the Poseidon sponge arity type `typenum::U2` for the chain hash.
# Pinned to the exact version Nova 0.76 already resolves (1.4.5, which re-exports `typenum`), so
# the `U2` we pass is the *same* type Nova's `Arity` impls are written against and no transitive
# version changes. `generic_array::typenum::U2` ⇒ `pub extern crate typenum` in generic-array 1.x.
generic-array = "=1.4.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode 1.x binary encoding for the committed proof/vk fixtures (Nova types are serde).
bincode = "=1.3.3"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[profile.release]
opt-level = 3
