[package]
name = "pca-zkvm-host"
version = "0.1.0"
edition = "2021"

[dependencies]
pca-zkvm-methods = { path = "../methods" }
pca-zkvm-core = { path = "../core" }
risc0-zkvm = { version = "^3.0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Mints the REAL signed capability chain + leaf PCActn for the fixture (deterministic from fixed seeds),
# using the SAME canonical bytes the guest verifies. v2 Ed25519 sigs verify under keys.ts `verify` too.
ed25519-dalek = "2"
