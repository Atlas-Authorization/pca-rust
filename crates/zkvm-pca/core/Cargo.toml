[package]
name = "pca-zkvm-core"
version = "0.1.0"
edition = "2021"
description = "Faithful port of the PCA Policy-VM release gate (full predicate DSL + fixed-point risk + caveats + native-sha256 commitments) for execution inside a zkVM guest"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
base64 = "0.22"
regex = "1"
# Ed25519 (RFC 8032) capability-hop + leaf PCActn signature verification, computed IN the zkVM guest.
# v2 is pure Rust and compiles for the rv32im guest target (curve25519-dalek serial u32 backend). The
# guest uses `verify_strict` (small-order A/R rejected, canonical encodings) to match keys.ts `verify`.
ed25519-dalek = "2"
