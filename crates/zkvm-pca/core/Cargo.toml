[package]
name = "pca-zkvm-core"
version = "0.1.0"
edition = "2021"
description = "Faithful port of the PCA Policy-VM release gate (full predicate DSL + fixed-point risk + caveats + native-sha256 commitments) for execution inside a zkVM guest"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.8"
base64 = "0.22"
# Ed25519 (RFC 8032) capability-hop + leaf PCActn signature verification, computed IN the zkVM guest.
# v2 is pure Rust and compiles for the rv32im guest target (curve25519-dalek serial u32 backend). The
# guest uses `verify_strict` (small-order A/R rejected, canonical encodings) to match keys.ts `verify`.
ed25519-dalek = "2"
# Direct dependency only for the torsion-freeness checks (CompressedEdwardsY / is_torsion_free); resolves to the
# same crate ed25519-dalek uses (and to the risc0-accelerated fork under the guest's [patch.crates-io]).
curve25519-dalek = "4"
# PCA 0.4.2: post-quantum suites in the guest (pure Rust, no_std-capable; same FIPS 204 crate as sdks/rust-pca).
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_128f", "slh_dsa_sha2_256s"] }
# FN-DSA-512 / -1024 verification (Thomas Pornin's fn-dsa-vrfy, the crate rust-pca and the TS reference's wasm use): pure
# integer arithmetic, no_std, builds for the rv32im guest.
fn-dsa-vrfy = "0.4"
