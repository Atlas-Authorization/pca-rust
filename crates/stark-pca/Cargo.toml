[package]
name = "stark-pca"
version = "0.1.0"
edition = "2021"
description = "Transparent, post-quantum STARK (Winterfell) proof of the PCA release gate"
license = "MIT OR Apache-2.0"

[dependencies]
winterfell = "0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[profile.release]
opt-level = 3

# Winterfell ships a DEBUG-ONLY aid (`validate_transition_degrees`) that requires EXACT
# equality between each constraint's *declared* degree and its *measured* degree. The
# release gate has data-dependent degrees — e.g. a zero-valued risk input (taint = 0)
# collapses that range-check's constraints, and the constant "value" columns collapse the
# boolean/allow constraints, to degree 0 — which no single fixed declaration can match for
# every witness. Our declared degrees are correct UPPER bounds (never under-declared), so
# the generated proofs are sound and verify. We therefore disable this dev-only assertion
# for the test profile; the proofs themselves are the real correctness check.
[profile.test]
debug-assertions = false
