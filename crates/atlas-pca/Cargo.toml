[package]
name = "atlas-pca"
version = "0.6.0"
edition = "2021"
description = "Atlas Proof-Carrying Authority for Rust: the reference verifier and the agent side (grants, delegation, signed actions)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Atlas-Authorization/pca-rust"
homepage = "https://github.com/Atlas-Authorization/pca-rust"
documentation = "https://docs.rs/atlas-pca"
keywords = ["authorization","agents","verifier","ed25519","pca"]
categories = ["cryptography","authentication"]
exclude = ["/tests/","/test-data/","/.gitignore","/examples/","/seal-src/zstd/tests/","/seal-src/zstd/examples/","/seal-src/zlib/examples/","/seal-src/msgsl/tests/"]
build = "build.rs"

[dependencies]
ed25519-dalek = "2"
# wipes Ed25519 seeds and the FN-DSA signing key buffer when they go out of scope (ed25519-dalek, fips204 and fips205 keys already zeroize on drop)
zeroize = "1"
curve25519-dalek = "4"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
base64 = "0.22"
# WHATWG URL parsing for the protocol bridges (RFC 9728 resource identifiers, metadata URLs): the same parse the reference's `new URL` does.
url = "2"
# SIEM credential scrubbing (the reference regexes: linear time, no backreferences).
regex = "1"
# HMAC-SHA256 (DPoP stateless nonces, webhook signatures): RustCrypto, already in the tree through the ECDSA crates.
hmac = "0.12"
# HKDF-SHA256 (the PUF fuzzy extractor and the TPM endorsement-key response): RustCrypto, the same family as hmac and sha2.
hkdf = "0.12"
# OS CSPRNG for the aggregate sampler's `secure` noise mode (already in the tree through rand_core).
getrandom = "0.2"
# ActionDef strings are checked NFC (the strict JSON profile).
unicode-normalization = "0.1"
# B4 post-quantum: ML-DSA-65 (FIPS-204) verification, cross-impl compatible with the
# @noble/post-quantum (vectors) and cloudflare/circl (go-pca) signatures (empty context).
fips204 = "0.4"
# Suite capability (packages/pca/conformance/SUITES.md): SLH-DSA-SHA2-128f / -256s (FIPS 205, pure, empty context; same
# IntegrityChain family as fips204 and the zkVM guest) and FN-DSA-512 / -1024 verification (Thomas Pornin's fn-dsa-vrfy,
# the crate @atlasauth/pca-fndsa-wasm wraps for the TS reference: DOMAIN_NONE + HASH_ID_RAW).
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_128f", "slh_dsa_sha2_256s", "default-rng"] }
fn-dsa-vrfy = "0.4"
# Optional FN-DSA SIGNING (feature `fndsa-sign`, the producer side): the same implementation family as fn-dsa-vrfy.
fn-dsa-sign = { version = "0.4", optional = true }
fn-dsa-kgen = { version = "0.4", optional = true }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
# SHAKE256 for the seeded FN-DSA keygen / signing that reproduces the reference's known-answer vectors.
fn-dsa-comm = { version = "0.4", optional = true }

# Vendor hardware-attestation verifiers (AMD SEV-SNP, Intel TDX DCAP, Azure MAA, GCP Confidential Space, NVIDIA GPU):
# ECDSA P-256 / P-384 verification, RSA (PKCS#1 v1.5 and PSS) verification and SHA-1 (OCSP key hashes). The X.509 / DER readers
# are in the crate itself.
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# ECDSA P-521 verification (JOSE ES512: OIDC ID tokens, DPoP proofs); the RustCrypto crate of the same family as p256 / p384.
p521 = { version = "0.13.3", features = ["ecdsa"] }
rsa = "0.9"
# AES-256-GCM for the connection vault's envelope-encrypted token store (RustCrypto, audited family of the other crates here).
aes-gcm = "0.10"
sha1 = "0.10"
# BLS12-381 (aggregate signatures, BBS, FAME ABE): the audited blst library, constant-time scalar and pairing code.
# Post-quantum KEM base OT for the MPC layer (RustCrypto ML-KEM, FIPS 203; deterministic hooks reproduce the reference vectors) and SHAKE256 for the KOS challenge.
ml-kem = { version = "0.2", features = ["deterministic"] }
sha3 = "0.10"
blst = "0.3"

# ICU root collation (UCA / CLDR root, tertiary): the order `String.prototype.localeCompare` makes, for the guardian-id tie-break in src/ha.rs
# (feature `icu-collation`, on by default; Unicode-3.0 license, compiled-in data).
icu_collator = { version = "2", optional = true }

# YAML 1.2 scanner/parser (event stream) for the authoring-file text loader.
yaml-rust2 = { version = "0.13", default-features = false }

# Endemic-LWE base OT lattice core (feature mpc-endemic), its safe API without the wasm glue.
wasmtime = { version = "30", default-features = false, features = ["runtime", "cranelift", "std"], optional = true }
pca-mpc-lwe-ot-wasm = { path = "../pca-mpc-lwe-ot-wasm", version = "0.1.0", default-features = false, features = ["hoststd"], optional = true }
# Groth16 pairing check and prover for the zk compliance module (feature `zk`, src/zk.rs): arkworks behind the pca-zk crate.
pca-zk = { path = "../pca-zk", version = "0.1.0", optional = true }

# AI-stack glue, each behind its own feature (src/ai_*.rs): OpenAI chat tool-call types, rig tools, rmcp tool calls.
async-openai = { version = "0.43", optional = true, default-features = false, features = ["chat-completion-types"] }
rig-core = { version = "0.46", optional = true, default-features = false }
rmcp = { version = "3.10", optional = true, default-features = false, features = ["server"] }
# langchain-rust tools and swiftide tools (features `langchain-rust`, `swiftide`; both implement `#[async_trait]` traits).
langchain-rust = { version = "8", optional = true, default-features = false }
swiftide-core = { version = "0.34", optional = true }
async-trait = { version = "0.1", optional = true }
# `ContextValue` for the rig proof slot needs serde derives.
serde = { version = "1", optional = true, features = ["derive"] }

# Networked MPC driver (feature `mpc-net-driver`): mutual TLS 1.3 mesh with pinned certificates, per-run identities. None of these is in the default build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"], optional = true }

# Optional tower/axum middleware (feature `axum`). Kept out of the default build so the base
# verifier stays dependency-light.
axum = { version = "0.7", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
# Optional Actix-web 4 guard (feature actix), built on the same framework-free core as the axum guard.
actix-web = { version = "4", optional = true, default-features = false }

# Optional Ed448 (feature `ed448`): OpenSSL 3's EdDSA, the vetted implementation, for DPoP / OIDC / JOSE verification and signing.
openssl = { version = "0.10", optional = true }

# Optional durable replay store for `authorize` (feature `sqlite`): SQLite compiled in (no system library needed).
rusqlite = { version = "0.41", optional = true, features = ["bundled"] }

# Feature `less`: the LESS suites through the patched reference C in less-c/, compiled by build.rs.
[build-dependencies]
cc = { version = "1", optional = true }
# Feature `fhe-seal-vendored`: configures and builds the SEAL sources shipped in seal-src/ (no system library, no network).
cmake = { version = "0.1", optional = true }

[features]
default = ["icu-collation"]
# Root-locale collation of guardian ids (src/ha.rs `locale_compare`) through ICU4X. Without it a Latin-script approximation is used.
icu-collation = ["dep:icu_collator"]
# In-process core-module WebAssembly host (src/sandbox_wasm.rs) on the wasmtime engine: fuel, wall-clock epoch, memory cap, no WASI.
sandbox-wasm = ["dep:wasmtime"]
async-openai = ["dep:async-openai"]
rig = ["dep:rig-core", "dep:serde"]
rmcp = ["dep:rmcp"]
langchain-rust = ["dep:langchain-rust", "dep:async-trait"]
swiftide = ["dep:swiftide-core", "dep:async-trait"]
# BFV through Microsoft SEAL's C export API (libsealc, linked from ATLAS_PCA_SEAL_LIB); src/fhe_seal.rs.
fhe-seal = []
# Endemic-LWE base OT over the lattice core crate (src/mpc_endemic.rs).
mpc-endemic = ["dep:pca-mpc-lwe-ot-wasm"]
# Groth16 verification and proving in src/zk.rs (BN254 and BLS12-381). Without it the zk module's pure parts work and a proof
# that reaches the pairing check is refused.
zk = ["dep:pca-zk"]
# The networked MPC driver (src/mpc_net_driver/, the `pca-mpc-party` binary): TLS mesh, dealer and no-dealer protocols, launcher.
mpc-net-driver = ["dep:rustls", "dep:tokio", "dep:tokio-rustls", "dep:rcgen"]
# The party binary with the post-quantum endemic-LWE base OT (ot.kind "lwe"): `cargo build --release --features mpc-net-lwe --bin pca-mpc-party`.
mpc-net-lwe = ["mpc-net-driver", "mpc-endemic"]
# `fhe-seal` with libsealc built from the SEAL 4.1.2 sources shipped in this crate (seal-src/; needs cmake and a C++17 compiler,
# no network, Unix targets). Enabling it is all a consumer does: the build links the library and sets an rpath to it.
fhe-seal-vendored = ["fhe-seal", "dep:cmake"]
# LESS suites (`less-cat1`, `hybrid-ed25519-less-cat1`): links the patched LESS reference C (a NIST round-2 candidate, not a
# standard) shipped in this crate's less-c/ (or the directory in ATLAS_PCA_LESS_SRC). Off by default: without it both suites are
# refused with `unsupported_suite`.
less = ["dep:cc"]
# Ergonomic tower `Layer`/`Service` + axum `from_fn` guard in `middleware`.
axum = ["dep:axum", "dep:tower-layer", "dep:tower-service"]
# `SqliteStateStore`: a durable `authorize` replay store on SQLite (rusqlite, bundled).
sqlite = ["dep:rusqlite"]
# Actix-web 4 Transform/Service guard (src/actix.rs; needs the middleware core, hence axum).
actix = ["dep:actix-web", "axum"]
# `agent::PqKeyPair::generate("FN-DSA-512" | "FN-DSA-1024")` and the fn-dsa-512 / fn-dsa-1024 signing suites.
fndsa-sign = ["dep:fn-dsa-sign", "dep:fn-dsa-kgen", "dep:fn-dsa-comm", "dep:rand_core"]

# Ed448 JWS signing and verification through OpenSSL 3 (src/jose.rs); without it Ed448 is refused.
ed448 = ["dep:openssl"]
# `ed448` with OpenSSL 3.x compiled from source (openssl-src, needs perl and a C compiler) instead of the system library. Ed448 only
# needs OpenSSL 3.0; nothing in this crate calls the OpenSSL 3.5 ML-KEM / ML-DSA APIs (those suites are the pure-Rust crates above).
ed448-vendored = ["ed448", "openssl/vendored"]

[[bin]]
name = "pca-mpc-party"
path = "src/bin/pca_mpc_party.rs"
required-features = ["mpc-net-driver"]

# The k042 differential unit tests parse oracle corpora nested thousands of levels deep (serde_json stops at 128).
[dev-dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth", "preserve_order"] }

[package.metadata.pca]
# Maturity tier: stable | production | experimental (the PCA maturity tiers page defines them)
maturity = "stable"

# No pqc_kyber [patch] here: the lattice crate patches it only so its wasm32 build skips upstream's cdylib target; a native build
# uses the crates.io release unchanged, and a [patch] would not survive a publish anyway.
