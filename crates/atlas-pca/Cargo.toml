[package]
name = "atlas-pca"
version = "0.5.0"
edition = "2021"
description = "Reference verifier for Atlas Proof-Carrying Authority (core PCActn checks)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Atlas-Authorization/pca-rust"
homepage = "https://github.com/Atlas-Authorization/pca-rust"
documentation = "https://docs.rs/atlas-pca"
keywords = ["authorization","agents","verifier","ed25519","pca"]
categories = ["cryptography","authentication"]
exclude = ["tests/","/.gitignore","examples/"]
build = "build.rs"

[dependencies]
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
base64 = "0.22"
# OS CSPRNG for the aggregate sampler's `secure` noise mode (already in the tree through rand_core).
getrandom = "0.2"
# ActionDef strings are checked NFC (the strict JSON profile).
unicode-normalization = "0.1"
# B4 post-quantum: ML-DSA-65 (FIPS-204) verification, cross-impl compatible with the
# @noble/post-quantum (vectors) and cloudflare/circl (go-pca) signatures (empty context).
fips204 = "0.4"
# Suite capability (packages/pca/conformance/SUITES.md): SLH-DSA-SHA2-128f / -256s (FIPS 205, pure, empty context; same
# IntegrityChain family as fips204 and the zkVM guest) and FN-DSA-512 / -1024 verification (Thomas Pornin's fn-dsa-vrfy,
# the crate @atlasauth/pca-fndsa-wasm wraps for the TS reference: DOMAIN_NONE + HASH_ID_RAW).
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_128f", "slh_dsa_sha2_256s", "default-rng"] }
fn-dsa-vrfy = "0.4"
# Optional FN-DSA SIGNING (feature `fndsa-sign`, the producer side): the same implementation family as fn-dsa-vrfy.
fn-dsa-sign = { version = "0.4", optional = true }
fn-dsa-kgen = { version = "0.4", optional = true }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }

# Vendor hardware-attestation verifiers (AMD SEV-SNP, Intel TDX DCAP, Azure MAA, GCP Confidential Space, NVIDIA GPU):
# ECDSA P-256 / P-384 verification, RSA (PKCS#1 v1.5 and PSS) verification and SHA-1 (OCSP key hashes). The X.509 / DER readers
# are in the crate itself.
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = "0.9"
sha1 = "0.10"

# Optional tower/axum middleware (feature `axum`). Kept out of the default build so the base
# verifier stays dependency-light.
axum = { version = "0.7", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

# Optional durable replay store for `authorize` (feature `sqlite`): SQLite compiled in (no system library needed).
rusqlite = { version = "0.41", optional = true, features = ["bundled"] }

# Feature `less`: the LESS suites through the patched reference C in less-c/, compiled by build.rs.
[build-dependencies]
cc = { version = "1", optional = true }

[features]
# LESS suites (`less-cat1`, `hybrid-ed25519-less-cat1`): links the patched LESS reference C (a NIST round-2 candidate, not a
# standard) shipped in this crate's less-c/ (or the directory in ATLAS_PCA_LESS_SRC). Off by default: without it both suites are
# refused with `unsupported_suite`.
less = ["dep:cc"]
# Ergonomic tower `Layer`/`Service` + axum `from_fn` guard in `middleware`.
axum = ["dep:axum", "dep:tower-layer", "dep:tower-service"]
# `SqliteStateStore`: a durable `authorize` replay store on SQLite (rusqlite, bundled).
sqlite = ["dep:rusqlite"]
# `agent::PqKeyPair::generate("FN-DSA-512" | "FN-DSA-1024")` and the fn-dsa-512 / fn-dsa-1024 signing suites.
fndsa-sign = ["dep:fn-dsa-sign", "dep:fn-dsa-kgen", "dep:rand_core"]

# The k042 differential unit tests parse oracle corpora nested thousands of levels deep (serde_json stops at 128).
[dev-dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth", "preserve_order"] }

[package.metadata.pca]
# Maturity tier: stable | production | experimental (the PCA maturity tiers page defines them)
maturity = "stable"
