[package]
name = "atlas-pca"
version = "0.1.0"
edition = "2021"
description = "Reference verifier for Atlas Proof-Carrying Authority (core PCActn checks, M0-M3)"
license = "MIT"
publish = false

[dependencies]
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
# B4 post-quantum: ML-DSA-65 (FIPS-204) verification, cross-impl compatible with the
# @noble/post-quantum (vectors) and cloudflare/circl (go-pca) signatures (empty context).
fips204 = "0.4"

# Optional tower/axum middleware (feature `axum`). Kept out of the default build so the base
# verifier stays dependency-light.
axum = { version = "0.7", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

[features]
# Ergonomic tower `Layer`/`Service` + axum `from_fn` guard in `middleware`.
axum = ["dep:axum", "dep:tower-layer", "dep:tower-service"]
