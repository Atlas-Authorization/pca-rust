# GENERATED by scripts/sync-pca-rust-mirror.sh (in the private monorepo) — the
# pca-rust Cargo workspace root. Each member keeps its OWN crate Cargo.toml; this
# virtual manifest only wires them together. Do not hand-edit in the mirror;
# regenerate from the monorepo.
[workspace]
resolver = "2"
members = [
    "crates/atlas-pca",
    "crates/stark-pca",
    "crates/folding-pca",
]
# zkvm-pca is EXCLUDED on purpose. Its Cargo.toml declares its OWN [workspace]
# (members host/methods/core), and methods/guest is a FURTHER nested workspace
# built by risc0-build with a risc0 [patch.crates-io] fork set (sha2 /
# curve25519-dalek / crypto-bigint) for the rv32im guest. A workspace root cannot
# be a member of another workspace, and those guest patches must not leak into the
# host graph. Build it from its own directory:
#   cd crates/zkvm-pca && cargo build --release
exclude = [
    "crates/zkvm-pca",
]

# Profiles are HOISTED here from the member crates: Cargo ignores [profile.*] in
# non-root manifests, so a build/test from the workspace root uses these. The member
# crates keep their own copies (crate source is never edited by the sync), and Cargo
# will warn that the member profiles are ignored — expected.
[profile.release]
opt-level = 3

# stark-pca REQUIRES debug-assertions OFF in the test profile: Winterfell ships a
# DEBUG-ONLY aid (validate_transition_degrees) that demands exact declared==measured
# constraint-degree equality, which the data-dependent release-gate AIR cannot meet
# for every witness (its declared degrees are correct UPPER bounds, so the proofs are
# sound and verify). With this hoist, `cargo test` across the workspace — including
# `-p stark-pca` — passes.
[profile.test]
debug-assertions = false
