          # --caught --unviable (output only): every outcome is logged with its build + test seconds, so the per-mutant cost is measurable
          # inside the scope, after carry.mjs: the scope's own memory.events (its oom_kill count) for the attribution check
          if [ "$KIND" = cm ]; then
            drv=("$MONO/tools/pca-audit/rust-mutate/carry.mjs" run --pkg="${{ matrix.pkg }}" --exclude="${{ matrix.exclude }}" \
              --shard="${{ matrix.k0 }}" --of="${{ matrix.kof }}" --out="$RUNNER_TEMP/mut" "${carry[@]}" "${names[@]}" -- \
              -j 2 --minimum-test-timeout 60 --timeout-multiplier 5 --profile mutants --test-tool nextest --cargo-test-arg="--config-file=$NXC" --caught --unviable)
          else
            drv=("$MONO/tools/pca-audit/rust-mutate/stmt-run.mjs" run --tool="$STMT_TOOL" --pkg="${{ matrix.pkg }}" --exclude="${{ matrix.exclude }}" \
              --shard="${{ matrix.k0 }}" --of="${{ matrix.kof }}" --out="$RUNNER_TEMP/mut" \
              --run-errors="$RUNNER_TEMP/run-errors.json" -j=2 --min-timeout=60 --multiplier=5 "${carry[@]}" "${names[@]}" -- --cargo-profile mutants --config-file "$NXC")
          fi
