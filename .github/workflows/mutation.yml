          { echo "MEMEV=$MEMEV"; echo "CARRY_ULIMIT_KB=$CARRY_ULIMIT_KB"; echo "NXC=$NXC"; echo "SCOPE_PROPS=${props[*]}"; echo "RUSTFLAGS=${RUSTFLAGS:-}"; } >> "$GITHUB_ENV"
      - name: Fallback / sample mutant names (fbplan)
        if: ${{ matrix.names != '' }}
