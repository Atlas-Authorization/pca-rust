          name: fb-names
          path: ${{ runner.temp }}/fb-names
      - name: Mutate
        env:
          # a mutant edits one function: the incremental cache re-uses every other codegen unit and every unchanged test crate
          CARGO_INCREMENTAL: '1'
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          carry=()
          [ -z "${BASE_POOL:-}" ] || carry=(--carry="$BASE_POOL")
          export KIND="${{ matrix.kind }}" DIR="${{ matrix.dir }}"
          # fallback / sample shards of a schema crate: exactly the mutants fbplan listed (never carried)
