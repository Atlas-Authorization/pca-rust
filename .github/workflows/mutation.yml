          DIR: ${{ matrix.dir }}
          KEY: ${{ matrix.key }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path"); const d = process.argv[1], pre = process.env.DIR + "/";
            const rd = (f) => fs.existsSync(path.join(d, f)) ? fs.readFileSync(path.join(d, f), "utf8").split("\n").filter(Boolean) : [];
            const counts = { caught: rd("caught.txt").length, missed: rd("missed.txt").length, timeout: rd("timeout.txt").length, unviable: rd("unviable.txt").length };
            const src = new Map(); const line = (f, n) => { if (!src.has(f)) src.set(f, fs.readFileSync(f, "utf8").split("\n")); return (src.get(f)[n - 1] || "").trim(); };
            const surv = rd("missed.txt").map((l) => {
              const m = /^(.+?):(\d+):(\d+): (.*)$/.exec(l); if (!m) throw new Error("unparsed: " + l);
              if (!m[1].startsWith(pre)) throw new Error("mutant outside the crate: " + l);
              return { crate: process.env.KEY, file: m[1].slice(pre.length), mutant: m[4], line: line(m[1], +m[2]), lineno: +m[2] };
            });
            fs.writeFileSync("counts.json", JSON.stringify(counts)); fs.writeFileSync("survivors.json", JSON.stringify(surv));
          ' "$RUNNER_TEMP/mut/mutants.out"
          node .github/scripts/mutation-shard-report.mjs --crate="${{ matrix.key }}" --shard=${{ matrix.shard }} --of=${{ matrix.of }} --tool=cargo-mutants \
            --counts=counts.json --survivors=survivors.json --out=shard-${{ matrix.shard }}.json
          cp "$RUNNER_TEMP/run-errors.json" run-errors-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.names == '' }}
        with:
          name: shard-${{ matrix.key }}-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.names == '' }}
        with:
          name: mut-results-${{ matrix.key }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/mut-results/
          retention-days: 30


  # one schema build per group (schema-gen + schema-build.mjs): the group's mutants behind the runtime switch, built ONCE; the
  # unmutated schema binaries must pass the full suite; the reach map and the binaries (nextest archive) go to the run shards
  schema:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.natives.result == 'success' }}
    name: schema ${{ matrix.key }} group ${{ matrix.g }}
    needs: [reuse, plan, natives]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.schema) }}
    steps:
      - name: Per-runner TMPDIR
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full shared corpus from the flagship
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$GITHUB_WORKSPACE/crates/atlas-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$GITHUB_WORKSPACE/crates/atlas-pca/test-data" oprf:oprf mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe-go core-frost-java:core-frost-java frost-dkg:frost-dkg
      - name: One aggregate test target (atlas-pca)
        if: ${{ matrix.key == 'rust-pca' }}
        run: |
          python3 -I "$MONO/tools/pca-audit/rust-mutate/aggregate-tests.py" crates/atlas-pca
          python3 -I "$MONO/tools/pca-audit/rust-mutate/aggregate-tests.py" crates/atlas-pca --check
