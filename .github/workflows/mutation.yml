name: Mutation

# Mutation testing of the verifier crates with cargo-mutants: atlas-pca, and the published proof crates stark-pca (lib.rs; its
# src/bin/gen_fixtures.rs only regenerates committed fixtures) and pca-folding-ivc (lib.rs; src/bin/demo.rs and longfold.rs are
# example programs). zkvm-pca is not published and not mutated here. Each crate has its own shards, ledger key and merge.
# History of the atlas-pca split: (--shard k/N), split into 144 shards on separate
# runners (14 shards ran 3.5-5.5 h each on the 0.4.2 crate and 8 of them hit the 6 h limit; 42 shards then ran 0.9-4.8 h with
# two still cut at the 300 min cap; on 0.5 the unoptimized suite took ~42 min per mutant and every one of 63 shards hit the
# 345 min cap). Now: the optimized `mutants` profile (root Cargo.toml), nextest (fail-fast: a caught mutant stops at its first
# failing test) and 144 shards. The merge job checks the missed mutants against the equivalent-mutant ledger (flagship
# tools/pca-audit/native-check-equivalents.mjs): it passes when every survivor is a ledgered equivalent and no ledger entry
# is stale. 175 + 64 shards of atlas-pca (+ 4+1 and 5+1 of the proof crates = 250 jobs, the 256 limit of one matrix; stark-pca shard 1 of 2 ran 42 min) (the per-mutant build, not the shard count, decides the cost: see CARGO_INCREMENTAL below; the
# proof crates 2 + 5). --all-features: the middleware (axum) and its tests are feature-gated. Runs on demand and on ci/** branches
# (the release-candidate check), never on main pushes.
#
# SCHEMA RUNS (atlas-pca; CRATES `schema`): a per-mutant build costs minutes and the suite seconds, so the real build per mutant made
# every shard hours long. tools/pca-audit/rust-mutate/schema-gen writes a whole group of mutants (the SAME cargo-mutants and
# statement mutants, by name, as listed by the snapshot job) into one source tree behind a runtime switch (PCA_MUTANT=id); each is
# kept only when its text, with every switch collapsed for it, equals the real mutant's (round trip). The `schema` job builds a
# group ONCE (a mutant whose schema text does not compile is taken out by rustc's error spans and goes to a real build), proves the
# unmutated schema binaries pass the full suite, records which test reaches which mutant, and archives the binaries. A `run` shard
# then decides its slice at full strength: each mutant first against its reaching tests (a plain FAIL there is a real failing test:
# caught); anything else runs the FULL suite before it is recorded, with cargo-mutants' timeout rule. Mutants the schema cannot
# hold (const / async fns, `impl Trait` returns, struct fields, overlapping regions, schema text that does not compile) are FALLBACK:
# `fbplan` packs them into real per-mutant shards (cargo-mutants / stmt-run --names) in the shard matrix, plus one SAMPLE per run
# shard that the real tools also decide; `collect` requires exactly one decision per planned mutant and the samples identical both
# ways, then writes atlas-pca's two report shards (1: cargo-mutants, 2: statement) for the unchanged merge.
#
# STATEMENT SHARDS (after the cargo-mutants ones): cargo-mutants never forces a plain boolean `if`, an `if let` or a
# `let ... else`, nor deletes continue / break, a bare `x?;` or an early `return Err`. tools/pca-audit/rust-mutate/stmt-mut
# (syn) lists those mutants, minus any on a line cargo-mutants already mutates, and stmt-run.mjs builds and tests each one as
# cargo-mutants does (same profile, nextest, timeouts, memory scope). They report into the same shard reports, ledger and
# run-error gate; they always run in full (never carried). The merge also checks that every planned mutant was reported
# (plan-check.mjs, with a negative control).
#
# TARGETED mode (the default whenever a usable baseline exists; the pca-ruby scheme, tools/pca-audit/mut-carry +
# rust-mutate/carry.mjs): every shard uploads mut-results-<k> (each mutant's result, carried ones included) and the run uploads
# mut-snapshot (the tests + shared corpus it ran against). The next run pools the results of the newest earlier runs of this
# branch (the input `baseline_run` pins one) and runs cargo-mutants on ONLY: mutants the pool never saw, its missed / timed-out
# ones, and every mutant whose function (cargo-mutants' span) or the file's code outside every mutated function changed (plain
# comments and blank lines do not count; doc comments do). An `unviable` result is carried only when the whole production source
# is unchanged. A run is used as a baseline only when its cargo-mutants version + flags are identical and the tests and corpus it
# ran against only GREW since (new files, pure line insertions, JSON that gained data): any edited or removed test line, binary
# change or changed vector makes that run unusable and the shard runs in full. The pool is keyed by mutant identity (file,
# function, genre, description, occurrence), not by shard, so a different shard layout needs no special case. Each shard still
# reports its COMPLETE slice (carried results included), so the merge checks the ledger over the full picture. No usable
# baseline (or `full: true`) = a full run, which seeds the next one.
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'run id whose mut-results-<k> + mut-snapshot artifacts seed a targeted run (default: newest earlier runs on this branch)'
        required: false
        default: ''
      full:
        description: 'ignore any baseline results: mutate everything'
        type: boolean
        default: false
  push:
    branches: ['ci/**', '!ci/build-**']

permissions:
  contents: read
  actions: read

concurrency:
  # a push supersedes an earlier push run; a dispatched (queue) run is never killed by a later push to the branch
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CRATE: rust-pca
  # per crate: ledger key, cargo package, directory, excluded files (proven, listed in the status file), cargo-mutants shards,
  # then statement shards (a crate's report shards are 1..cm+stmt, the statement ones last); schema: the crate runs as schema groups
  # (its report shards are then the collect job's two: cm 1 + stmt 1) with that many run shards over all groups; win: the files only Windows compiles
  # (the file guard checks the list against the tree's cfg(windows) / cfg(not(unix)) module declarations), left out of the Linux
  # plan and mutated by both tools in the windows job, whose reports the merge counts instead
  CRATES: >-
    [{"key":"rust-pca","pkg":"atlas-pca","dir":"crates/atlas-pca","exclude":"","cm":1,"stmt":1,"schema":{"groups":16,"runs":240},"win":"src/private_file_windows.rs,src/durable_rename_windows.rs,src/durable_state_stub.rs,src/store_conformance_not_unix.rs"},
     {"key":"stark-pca","pkg":"stark-pca","dir":"crates/stark-pca","exclude":"src/bin","cm":4,"stmt":1},
     {"key":"folding-pca","pkg":"pca-folding-ivc","dir":"crates/folding-pca","exclude":"src/bin","cm":5,"stmt":1}]
  # part of the baseline identity (with the cargo-mutants version): a run with other flags is no baseline
  MUT_CFG: 'cargo-mutants -j2 min-timeout60 x5 timeouts-ledgered nextest-slow-terminate all-features profile-mutants nextest memscope13G-env-oomcontinue runerr-gate round-robin stmt-mut-v1 proof-crates optin-natives incremental stmt-carry-v1 survivor-carry agg-tests mold schema-v1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  SEAL_TAG: v4.1.2

jobs:
  reuse:
    name: reuse check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      hash: ${{ steps.reuse.outputs.hash }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      # input-hash reuse (ci-reuse.mjs): when an earlier run recorded the same input hash, every other job of this run is skipped.
      # continue-on-error: a failing check can only mean "no reuse"; FORCE_FULL / force_full / [force-full] bypass it.
      - id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || inputs.full || vars.FORCE_FULL == '1' || contains(github.event.head_commit.message, '[force-full]') }}
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          PARTIAL: ${{ false }}
          EXTRA: ''
        run: node .github/scripts/ci-reuse.mjs check --workflow=mutation --self=.github/workflows/mutation.yml --external=flagship --extra="$EXTRA"
  # the tests + corpus this run mutates against (the next run's baseline check); small, runs alongside the shards
  snapshot:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - name: mpc-endemic path dependency (cargo resolves every feature's dependencies when it lists the mutants)
        run: |
          mkdir -p packages/pca-mpc-lwe-ot-wasm
          cp -R "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" packages/pca-mpc-lwe-ot-wasm/
          # zk: the Groth16 crate, the same way
          mkdir -p packages/pca-zk
          cp -R "$MONO/packages/pca-zk/crate" packages/pca-zk/
      - name: Every shipped source file is in the mutation plan and holds a mutant
        run: |
          node "$MONO/tools/pca-audit/rust-mutate/file-guard.mjs" --self-test
          node -e 'for (const c of JSON.parse(process.env.CRATES)) console.log([c.pkg, c.dir, c.exclude || "-", c.win || "-"].join(" "))' |
            while read -r pkg dir ex win; do
              [ "$ex" = - ] && ex=; [ "$win" = - ] && win=
              node "$MONO/tools/pca-audit/rust-mutate/file-guard.mjs" --pkg="$pkg" --dir="$dir" ${ex:+--exclude-dir="$ex"} ${win:+--win-only="$win"}
            done
      - name: Mutation plan (cargo-mutants + statement mutants per crate), for the merge's every-mutant-reported check
        run: |
          M="$MONO/tools/pca-audit/rust-mutate/stmt-mut/Cargo.toml"
          cargo test -q --manifest-path "$M" --target-dir "$RUNNER_TEMP/stmt-mut-target"
          cargo build -q --release --manifest-path "$M" --target-dir "$RUNNER_TEMP/stmt-mut-target"
          mkdir -p mut-plan
          node -e 'for (const c of JSON.parse(process.env.CRATES)) console.log([c.key, c.pkg, c.dir, c.exclude || "-", c.cm, c.stmt, c.win || "-"].join(" "))' |
            while read -r key pkg dir ex cm st win; do
              ex="$(node -e 'const [d, e, w] = process.argv.slice(1); console.log([...(e === "-" ? [] : [`${d}/${e}/**`]), ...(w === "-" ? [] : w.split(",").map((f) => `${d}/${f}`))].join(","))' "$dir" "$ex" "$win")"
              node "$MONO/tools/pca-audit/rust-mutate/stmt-run.mjs" list --tool="$RUNNER_TEMP/stmt-mut-target/release/stmt-mut" --pkg="$pkg" --exclude="$ex" --cm-out="$RUNNER_TEMP/cm-$key.json" > "$RUNNER_TEMP/stmt-$key.json"
              node -e '
                const [f, key, cm, st, dir, win] = process.argv.slice(1), p = require(f);
                // the Windows-only files are in no Linux plan, of either tool
                const wf = win === "-" ? [] : win.split(",").map((w) => `${dir}/${w}`);
                const leak = [...p.files_list, ...p.mutants.map((m) => m.file)].filter((x) => wf.includes(x));
                if (leak.length) { console.error(`::error::Windows-only file(s) in the Linux plan: ${[...new Set(leak)].join(", ")}`); process.exit(1); }
                const plan = { cargo_mutants: p.cargo_mutants, cm_shards: +cm, stmt: p.count, stmt_shards: +st };
                require("fs").writeFileSync(`mut-plan/${key}.json`, JSON.stringify(plan));
                const g = {}; for (const m of p.mutants) g[m.genre] = (g[m.genre] || 0) + 1;
                console.log(key, JSON.stringify(plan), "statement mutants by form", JSON.stringify(g), "skipped (line has a cargo-mutants mutant)", p.skipped_lines_with_a_cargo_mutant);
              ' "$RUNNER_TEMP/stmt-$key.json" "$key" "$cm" "$st" "$dir" "$win"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: mut-plan
          path: mut-plan/
      # the schema crate's mutant lists (the same listing as its plan above) and its groups, for the schema / run / fbplan /
      # collect jobs; the generator's and the drivers' self-tests first (each mutation form round-trips to the real replacement)
      - name: Schema groups (generator self-tests, lists, groups)
        run: |
          cargo test -q --manifest-path "$MONO/tools/pca-audit/rust-mutate/schema-gen/Cargo.toml" --target-dir "$RUNNER_TEMP/schema-gen-target"
          node "$MONO/tools/pca-audit/rust-mutate/schema-plan.mjs" --self-test
          node "$MONO/tools/pca-audit/rust-mutate/schema-collect.mjs" --self-test
          mkdir -p mut-list
          node -e '
            const fs = require("fs"), T = process.env.RUNNER_TEMP, cs = JSON.parse(process.env.CRATES).filter((c) => c.schema);
            if (cs.length !== 1) { console.error("::error::exactly one schema crate is supported, CRATES has " + cs.length); process.exit(1); }
            const c = cs[0];
            fs.copyFileSync(`${T}/cm-${c.key}.json`, "mut-list/cm.json");
            fs.writeFileSync("mut-list/stmt.json", JSON.stringify(JSON.parse(fs.readFileSync(`${T}/stmt-${c.key}.json`, "utf8")).mutants));
            fs.writeFileSync(`${T}/schema-gr`, `${c.schema.groups} ${c.schema.runs}\n`); // read needs the newline, or it returns 1 and -e ends the step
          '
          read -r G R < "$RUNNER_TEMP/schema-gr"
          node "$MONO/tools/pca-audit/rust-mutate/schema-plan.mjs" --cm=mut-list/cm.json --stmt=mut-list/stmt.json --groups="$G" --runs="$R" --out=mut-list/groups.json
      - uses: actions/upload-artifact@v4
        with:
          name: mut-list
          path: mut-list/
      - name: Snapshot
        run: |
          node "$MONO/tools/pca-audit/rust-mutate/carry.mjs" files --pkg=atlas-pca > "$RUNNER_TEMP/src.txt"
          node "$MONO/tools/pca-audit/mut-carry/snapshot.mjs" make --root="$GITHUB_WORKSPACE" --exclude-list="$RUNNER_TEMP/src.txt" \
            --corpus-root="$MONO" --out=mut-snapshot --cfg="$MUT_CFG $(cargo mutants --version)" \
            --tool-files="$MONO/tools/pca-audit/rust-mutate/carry.mjs,$MONO/tools/pca-audit/rust-mutate/stmt-run.mjs,$MONO/tools/pca-audit/mut-carry/lib.mjs,$MONO/tools/pca-audit/rust-mutate/schema-run.mjs,$MONO/tools/pca-audit/rust-mutate/schema-gen/src/main.rs"
      - uses: actions/upload-artifact@v4
        with:
          name: mut-snapshot
          path: mut-snapshot/
          retention-days: 30

  plan:
    if: ${{ needs.reuse.outputs.skip != 'true' && needs.snapshot.result == 'success' }}
    needs: [reuse, snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.m.outputs.crates }}
      schema: ${{ steps.m.outputs.schema }}
      runs: ${{ steps.m.outputs.runs }}
      scrate: ${{ steps.m.outputs.scrate }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mut-list
          path: mut-list
      - id: m
        run: |
          node -e '
            const cs = JSON.parse(process.env.CRATES), gs = require("./mut-list/groups.json").groups, c = cs.find((x) => x.schema);
            const id = { key: c.key, pkg: c.pkg, dir: c.dir };
            const runs = gs.flatMap((g, i) => Array.from({ length: g.runs }, (_, r) => ({ ...id, g: i, r, runs: g.runs })));
            if (runs.length > 256) { console.error(`::error::${runs.length} run shards exceed one matrix (256)`); process.exit(1); }
            console.log("schema=" + JSON.stringify({ include: gs.map((_, g) => ({ ...id, g })) }));
            console.log("scrate=" + JSON.stringify(id));
            console.log("runs=" + JSON.stringify({ include: runs }));
            console.log("crates=" + JSON.stringify({ include: cs.map((c) => ({ key: c.key, dir: c.dir, of: c.cm + c.stmt, win: c.win || "" })) }));
          ' >> "$GITHUB_OUTPUT"

  # ONE job fetches the baseline (the pool of the newest usable earlier run) and hands it to every shard as one small artifact. Every shard
  # used to list the runs and download ~200 artifacts itself: the job token's API rate limit (403) then dropped most of the 174 shards
  # to a full run of their slice (run 44264958785: 163 of 175 atlas-pca shards ran 130-216 min instead of carrying). The pool is
  # fetched with retries; a pinned baseline_run that cannot be used fails the run instead of degrading to a full one.
  pool:
    name: baseline pool
    needs: snapshot
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      have: ${{ steps.pool.outputs.have }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - uses: actions/download-artifact@v4
        with:
          name: mut-snapshot
          path: ${{ runner.temp }}/snap
      - id: pool
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
        run: |
          out="$(node "$MONO/tools/pca-audit/mut-carry/baseline.mjs" --repo="$GITHUB_REPOSITORY" --branch="$GITHUB_REF_NAME" \
            --exclude-run="$GITHUB_RUN_ID" --explicit="$BASELINE" --snapshot="$RUNNER_TEMP/snap" --out="$RUNNER_TEMP/base")"
          if [ -n "$out" ]; then
            mkdir -p "$RUNNER_TEMP/pool"; cp "$RUNNER_TEMP/base/pool.json" "$RUNNER_TEMP/pool/pool.json"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ steps.pool.outputs.have == 'true' }}
        with:
          name: mut-pool
          path: ${{ runner.temp }}/pool/
          retention-days: 2

  # the native libraries of the opt-in modules, built once for all shards (not per shard): libsealc, the node-seal corpus and
  # the wasmtime host binary travel as one artifact
  natives:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship layout
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          n="$RUNNER_TEMP/natives"; mkdir -p "$n"
          lib="$(.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")"
          mkdir "$n/seal"; cp -a "$lib"/. "$n/seal/"
          .github/scripts/fhe-seal-corpus.sh "$n/fhe-seal.json.gz" "$MONO/tools/pca-audit/oracles/fhe-seal.mts"
          .github/scripts/build-wasmtime-host.sh "$RUNNER_TEMP/wasmtime-host" "$MONO/packages/pca-sandbox/wasmtime-host"
          cp "$RUNNER_TEMP/wasmtime-host/pca-wasmtime-host" "$n/"
      - uses: actions/upload-artifact@v4
        with:
          name: natives
          path: ${{ runner.temp }}/natives
          retention-days: 3

  shard:
    if: ${{ !cancelled() && needs.fbplan.result == 'success' && needs.natives.result == 'success' && needs.pool.result != 'failure' }}
    name: ${{ matrix.key }} ${{ matrix.shard }}/${{ matrix.of }} ${{ matrix.kind }}${{ matrix.sample && ' sample' || '' }}
    # the proof crates' shards, and a schema crate's fallback and sample mutants (real per-mutant builds; fbplan)
    needs: [reuse, fbplan, natives, pool]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # 20 of the org's 60 slots at most: 8 other languages run their CI and mutation alongside
      max-parallel: 12 # fair share: about 24 runners per PCA repo (10 repos, about 180 shared runners); one repo must never starve the rest
      matrix: ${{ fromJSON(needs.fbplan.outputs.matrix) }}
    steps:
      # cargo-mutants' scratch copies (each with its own target dir) live under this runner's own temp, never in a shared /tmp
      # (runner.* is not available in job-level env, so it is exported here)
      - name: Per-runner TMPDIR
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full shared corpus from the flagship
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$GITHUB_WORKSPACE/crates/atlas-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$GITHUB_WORKSPACE/crates/atlas-pca/test-data" oprf:oprf mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe-go core-frost-java:core-frost-java frost-dkg:frost-dkg
      # ONE test target for atlas-pca's 290 integration test files (mutation layout only; regular CI is unchanged): every mutant used to
      # rebuild and relink 290 test binaries. aggregate-tests.py generates tests/all_mutation.rs (#[path] modules) and switches the
      # manifest to it; its --check proves every tests/*.rs is included exactly once and no [[test]] entry is left out.
      - name: One aggregate test target (atlas-pca)
        if: ${{ matrix.key == 'rust-pca' }}
        run: |
          python3 -I "$MONO/tools/pca-audit/rust-mutate/aggregate-tests.py" crates/atlas-pca
          python3 -I "$MONO/tools/pca-audit/rust-mutate/aggregate-tests.py" crates/atlas-pca --check
      # a faster linker for the per-mutant relink (the mutants profile keeps its opt-level 1 / debug off; only the linker changes)
      - name: mold
        run: sudo apt-get install -y mold || true
      # --all-features compiles the opt-in modules into the mutated crate (fhe-seal, mpc-endemic, actix, sandbox-wasm), so their
      # tests need the same native setup as their own workflows (fhe.yml, sandbox-wasm.yml), or their mutants would be judged
      # by tests that skip or by a build that cannot link. Every atlas-pca shard (cargo-mutants and statement) carries it.
      - uses: actions/download-artifact@v4
        if: ${{ matrix.key == 'rust-pca' }}
        with:
          name: natives
          path: ${{ runner.temp }}/natives
      - name: Opt-in module natives (mpc-endemic crate; libsealc, corpus and wasmtime host from the natives job)
        if: ${{ matrix.key == 'rust-pca' }}
        shell: bash
        run: |
          set -euo pipefail
          # mpc-endemic: the optional path dependency (../../packages/pca-mpc-lwe-ot-wasm/crate from the crate directory)
          mkdir -p "$GITHUB_WORKSPACE/packages/pca-mpc-lwe-ot-wasm"
          cp -R "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" "$GITHUB_WORKSPACE/packages/pca-mpc-lwe-ot-wasm/"
          # zk: the Groth16 crate, the same way (the zk corpus replay then runs on the real pairing engine)
          mkdir -p "$GITHUB_WORKSPACE/packages/pca-zk"
          cp -R "$MONO/packages/pca-zk/crate" "$GITHUB_WORKSPACE/packages/pca-zk/"
          # fhe-seal and sandbox-wasm: built ONCE by the natives job (libsealc at the pinned tag, the node-seal reference corpus, the
          # wasmtime host binary); every shard only downloads them
          n="$RUNNER_TEMP/natives"
          chmod +x "$n/pca-wasmtime-host"
          echo "ATLAS_PCA_SEAL_LIB=$n/seal" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$n/seal${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_CORPUS=$n/fhe-seal.json.gz" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_BIN=$n/pca-wasmtime-host" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_SHA256=$(sha256sum "$n/pca-wasmtime-host" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Statement mutator (stmt-mut)
        if: ${{ matrix.kind == 'stmt' }}
        run: |
          cargo build -q --release --manifest-path "$MONO/tools/pca-audit/rust-mutate/stmt-mut/Cargo.toml" --target-dir "$RUNNER_TEMP/stmt-mut-target"
          echo "STMT_TOOL=$RUNNER_TEMP/stmt-mut-target/release/stmt-mut" >> "$GITHUB_ENV"
      - name: Baseline pool (targeted mode)
        if: ${{ needs.pool.outputs.have == 'true' && matrix.key == 'rust-pca' && matrix.names == '' }}
        uses: actions/download-artifact@v4
        with:
          name: mut-pool
          path: ${{ runner.temp }}/pool
      - name: Baseline pool (point the carry at it)
        if: ${{ needs.pool.outputs.have == 'true' && matrix.key == 'rust-pca' && matrix.names == '' }}
        run: echo "BASE_POOL=$RUNNER_TEMP/pool/pool.json" >> "$GITHUB_ENV"
      # the memory scope and the nextest profile every mutation driver runs under (shared by the shard, schema and run jobs)
      - name: Memory scope and nextest profile
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          if command -v mold >/dev/null; then export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-fuse-ld=mold"; echo "linker: mold"; else echo "linker: default (no mold)"; fi
          # a mutant that allocates without bound must die alone (caught), not exhaust the runner: 6 GiB address space per
          # process (applied to the mutants' processes by carry.mjs, not to node), 2 mutants at a time. carry.mjs runs
          # cargo-mutants (exit 0 / 2 missed / 3 timeouts are results, anything else fails) on this shard's mutants that no
          # earlier result vouches for and writes the COMPLETE shard (carried results included) to $RUNNER_TEMP/mut/mutants.out.
          # the 6 GiB cap is per process, and nextest runs several test processes per mutant: a runaway in shared code can sum
          # past the hosted runner's 16 GiB and starve the runner agent ("lost communication", run 41891707650 shards 66/68).
          # A cgroup holds the whole tree to 13 GiB with no swap, so the kernel kills the biggest test and the runner lives.
          # Used only where sudo + systemd-run work (hosted runners); elsewhere the per-process cap alone. A test killed this way
          # (or aborted by the per-process cap) decides nothing: see "run errors" below.
          # OOMPolicy=continue: systemd's default (stop) answers one OOM kill by sending SIGTERM to the whole scope, which ends the shard.
          scope=(); props=(); export MEMEV="" CARRY_ULIMIT_KB=6291456
