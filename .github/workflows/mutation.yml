            const fnOf = new Map(oc.map((o) => [o.scenario && o.scenario.Mutant && o.scenario.Mutant.name, (o.scenario && o.scenario.Mutant && o.scenario.Mutant.function && o.scenario.Mutant.function.function_name) || ""]));
