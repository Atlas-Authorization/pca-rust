          echo "LD_LIBRARY_PATH=$n/seal${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_CORPUS=$n/fhe-seal.json.gz" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_BIN=$n/pca-wasmtime-host" >> "$GITHUB_ENV"
