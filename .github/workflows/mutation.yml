          # process (applied to the mutants' processes by carry.mjs, not to node), 2 mutants at a time. carry.mjs runs
          # cargo-mutants (exit 0 / 2 missed / 3 timeouts are results, anything else fails) on this shard's mutants that no
          # earlier result vouches for and writes the COMPLETE shard (carried results included) to $RUNNER_TEMP/mut/mutants.out.
          # the 6 GiB cap is per process, and nextest runs several test processes per mutant: a runaway in shared code can sum
          # past the hosted runner's 16 GiB and starve the runner agent ("lost communication", run 41891707650 shards 66/68).
          # A cgroup holds the whole tree to 13 GiB with no swap, so the kernel kills the biggest test and the runner lives.
          # Used only where sudo + systemd-run work (hosted runners); elsewhere the per-process cap alone. A test killed this way
          # (or aborted by the per-process cap) decides nothing: see "run errors" below.
          # OOMPolicy=continue: systemd's default (stop) answers one OOM kill by sending SIGTERM to the whole scope, which ends the shard.
          scope=(); props=(); export MEMEV="" CARRY_ULIMIT_KB=6291456
          try=(-p MemoryMax=13G -p MemorySwapMax=0 -p OOMPolicy=continue)
          if sudo -n systemd-run --scope -q "${try[@]}" --uid="$(id -u)" --gid="$(id -g)" -- true 2>/dev/null; then
            props=("${try[@]}")
            MEMEV="$RUNNER_TEMP/mut-memory.events"; rm -f "$MEMEV"
            # sudo resets the environment (sudo-rs on ubuntu-26.04 ignores -E), so the scope gets all of it as arguments
            mapfile -d '' -t envs < <(env -0)
            scope=(sudo -n env "${envs[@]}" systemd-run --scope -q "${props[@]}" --uid="$(id -u)" --gid="$(id -g)" --)
            # fail in seconds, not at the end of a shard, if the cap or the attribution file cannot work in the scope
            "${scope[@]}" bash -c '[ "$CARRY_ULIMIT_KB" = 6291456 ] && [ "$MEMEV" = "$1" ] && [ -r "/sys/fs/cgroup$(cut -d: -f3- /proc/self/cgroup | head -1)/memory.events" ]' bash "$MEMEV" \
              || { echo "::error::the memory scope did not get its environment or memory.events"; exit 1; }
          fi
          echo "memory scope: ${props[*]:-none}"
          # the mutation drivers run under inscope.sh, which re-enters this scope (SCOPE_PROPS) per invocation
          # a mutant that stops a loop advancing hangs every test that reaches it; a deadline test then FAILS in seconds, but
          # nextest's fail-fast waits for the tests still running, so the run would end as a timeout anyway. nextest terminates
          # a test that runs past its slow-timeout (reported TIMEOUT, a failure): each limit sits well under the mutant's
          # cargo-mutants timeout (5x the baseline suite, min 60 s) and far over the crate's slowest real test. A mutant whose
          # only failures are these terminations has no plain FAIL line, so it is a run error (gate below), never a kill.
          # The proof crates' fuzz_decoder tests are wall-clock tests (an abort hunt over child processes, a 20 s fuzz budget that
          # asserts a minimum execution count): they run alone (all test threads), or the unmutated baseline fails under load
          # (run 42434682442: stark hostile_counts timed out at 40 s, folding fuzz got 173 executions). Stark's limit is 3 x 90 s.
          NXC="$RUNNER_TEMP/nextest-mutants.toml"
          printf '%s\n' '[profile.default]' 'slow-timeout = { period = "40s", terminate-after = 2 }' \
            '[[profile.default.overrides]]' "filter = 'package(stark-pca)'" 'slow-timeout = { period = "90s", terminate-after = 3 }' \
            '[[profile.default.overrides]]' "filter = 'package(pca-folding-ivc)'" 'slow-timeout = { period = "600s", terminate-after = 3 }' \
            '[[profile.default.overrides]]' "filter = 'binary(fuzz_decoder) | (package(atlas-pca) & test(/^fuzz_decoder::/))'" 'threads-required = "num-test-threads"' > "$NXC"
          cat "$NXC"
          { echo "MEMEV=$MEMEV"; echo "CARRY_ULIMIT_KB=$CARRY_ULIMIT_KB"; echo "NXC=$NXC"; echo "SCOPE_PROPS=${props[*]}"; echo "RUSTFLAGS=${RUSTFLAGS:-}"; } >> "$GITHUB_ENV"
      - name: Schema build, baseline and reach map
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          cargo build -q --release --manifest-path "$MONO/tools/pca-audit/rust-mutate/schema-gen/Cargo.toml" --target-dir "$RUNNER_TEMP/schema-gen-target"
          "$MONO/tools/pca-audit/rust-mutate/inscope.sh" node "$MONO/tools/pca-audit/rust-mutate/schema-build.mjs" --list="$RUNNER_TEMP/mut-list" --group=${{ matrix.g }} \
            --pkg="${{ matrix.pkg }}" --crate="$(echo "${{ matrix.pkg }}" | tr - _)" --root="${{ matrix.dir }}/src/lib.rs" \
            --gen="$RUNNER_TEMP/schema-gen-target/release/schema-gen" --out="$RUNNER_TEMP/schema" -- --config-file "$NXC"
          mkdir -p "$RUNNER_TEMP/dec"; mv "$RUNNER_TEMP/schema/dec.json" "$RUNNER_TEMP/dec/"
      - uses: actions/upload-artifact@v4
        with:
          name: schema-${{ matrix.key }}-${{ matrix.g }}
          path: ${{ runner.temp }}/schema/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: dec-${{ matrix.key }}-${{ matrix.g }}
          path: ${{ runner.temp }}/dec/

  # a run shard: its slice of one group's schema mutants, each decided at full strength on the prebuilt binaries (schema-run.mjs)
  run:
    if: ${{ !cancelled() && needs.schema.result == 'success' }}
    name: run ${{ matrix.key }} group ${{ matrix.g }} ${{ matrix.r }}/${{ matrix.runs }}
    needs: [reuse, plan, natives, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12 # fair share: about 24 runners per PCA repo (10 repos, about 180 shared runners); one repo must never starve the rest
      matrix: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - name: Per-runner TMPDIR
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full shared corpus from the flagship
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$GITHUB_WORKSPACE/crates/atlas-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$GITHUB_WORKSPACE/crates/atlas-pca/test-data" oprf:oprf mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe-go core-frost-java:core-frost-java frost-dkg:frost-dkg
      - name: One aggregate test target (atlas-pca)
        if: ${{ matrix.key == 'rust-pca' }}
        run: |
          python3 -I "$MONO/tools/pca-audit/rust-mutate/aggregate-tests.py" crates/atlas-pca
          python3 -I "$MONO/tools/pca-audit/rust-mutate/aggregate-tests.py" crates/atlas-pca --check
      - uses: actions/download-artifact@v4
        if: ${{ matrix.key == 'rust-pca' }}
        with:
          name: natives
          path: ${{ runner.temp }}/natives
      - name: Opt-in module natives (mpc-endemic crate; libsealc, corpus and wasmtime host from the natives job)
        if: ${{ matrix.key == 'rust-pca' }}
        shell: bash
        run: |
          set -euo pipefail
          # mpc-endemic: the optional path dependency (../../packages/pca-mpc-lwe-ot-wasm/crate from the crate directory)
          mkdir -p "$GITHUB_WORKSPACE/packages/pca-mpc-lwe-ot-wasm"
          cp -R "$MONO/packages/pca-mpc-lwe-ot-wasm/crate" "$GITHUB_WORKSPACE/packages/pca-mpc-lwe-ot-wasm/"
          # zk: the Groth16 crate, the same way (the zk corpus replay then runs on the real pairing engine)
          mkdir -p "$GITHUB_WORKSPACE/packages/pca-zk"
          cp -R "$MONO/packages/pca-zk/crate" "$GITHUB_WORKSPACE/packages/pca-zk/"
          # fhe-seal and sandbox-wasm: built ONCE by the natives job (libsealc at the pinned tag, the node-seal reference corpus, the
          # wasmtime host binary); every shard only downloads them
          n="$RUNNER_TEMP/natives"
          chmod +x "$n/pca-wasmtime-host"
          echo "ATLAS_PCA_SEAL_LIB=$n/seal" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$n/seal${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PCA_FHE_SEAL_CORPUS=$n/fhe-seal.json.gz" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_BIN=$n/pca-wasmtime-host" >> "$GITHUB_ENV"
          echo "PCA_WASMTIME_HOST_SHA256=$(sha256sum "$n/pca-wasmtime-host" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: schema-${{ matrix.key }}-${{ matrix.g }}
          path: ${{ runner.temp }}/bundle
      - name: Memory scope and nextest profile
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          if command -v mold >/dev/null; then export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-fuse-ld=mold"; echo "linker: mold"; else echo "linker: default (no mold)"; fi
          # a mutant that allocates without bound must die alone (caught), not exhaust the runner: 6 GiB address space per
          # process (applied to the mutants' processes by carry.mjs, not to node), 2 mutants at a time. carry.mjs runs
          # cargo-mutants (exit 0 / 2 missed / 3 timeouts are results, anything else fails) on this shard's mutants that no
          # earlier result vouches for and writes the COMPLETE shard (carried results included) to $RUNNER_TEMP/mut/mutants.out.
          # the 6 GiB cap is per process, and nextest runs several test processes per mutant: a runaway in shared code can sum
          # past the hosted runner's 16 GiB and starve the runner agent ("lost communication", run 41891707650 shards 66/68).
          # A cgroup holds the whole tree to 13 GiB with no swap, so the kernel kills the biggest test and the runner lives.
          # Used only where sudo + systemd-run work (hosted runners); elsewhere the per-process cap alone. A test killed this way
          # (or aborted by the per-process cap) decides nothing: see "run errors" below.
          # OOMPolicy=continue: systemd's default (stop) answers one OOM kill by sending SIGTERM to the whole scope, which ends the shard.
          scope=(); props=(); export MEMEV="" CARRY_ULIMIT_KB=6291456
          try=(-p MemoryMax=13G -p MemorySwapMax=0 -p OOMPolicy=continue)
          if sudo -n systemd-run --scope -q "${try[@]}" --uid="$(id -u)" --gid="$(id -g)" -- true 2>/dev/null; then
            props=("${try[@]}")
            MEMEV="$RUNNER_TEMP/mut-memory.events"; rm -f "$MEMEV"
            # sudo resets the environment (sudo-rs on ubuntu-26.04 ignores -E), so the scope gets all of it as arguments
            mapfile -d '' -t envs < <(env -0)
            scope=(sudo -n env "${envs[@]}" systemd-run --scope -q "${props[@]}" --uid="$(id -u)" --gid="$(id -g)" --)
            # fail in seconds, not at the end of a shard, if the cap or the attribution file cannot work in the scope
            "${scope[@]}" bash -c '[ "$CARRY_ULIMIT_KB" = 6291456 ] && [ "$MEMEV" = "$1" ] && [ -r "/sys/fs/cgroup$(cut -d: -f3- /proc/self/cgroup | head -1)/memory.events" ]' bash "$MEMEV" \
              || { echo "::error::the memory scope did not get its environment or memory.events"; exit 1; }
          fi
          echo "memory scope: ${props[*]:-none}"
          # the mutation drivers run under inscope.sh, which re-enters this scope (SCOPE_PROPS) per invocation
          # a mutant that stops a loop advancing hangs every test that reaches it; a deadline test then FAILS in seconds, but
          # nextest's fail-fast waits for the tests still running, so the run would end as a timeout anyway. nextest terminates
          # a test that runs past its slow-timeout (reported TIMEOUT, a failure): each limit sits well under the mutant's
          # cargo-mutants timeout (5x the baseline suite, min 60 s) and far over the crate's slowest real test. A mutant whose
          # only failures are these terminations has no plain FAIL line, so it is a run error (gate below), never a kill.
          # The proof crates' fuzz_decoder tests are wall-clock tests (an abort hunt over child processes, a 20 s fuzz budget that
          # asserts a minimum execution count): they run alone (all test threads), or the unmutated baseline fails under load
          # (run 42434682442: stark hostile_counts timed out at 40 s, folding fuzz got 173 executions). Stark's limit is 3 x 90 s.
          NXC="$RUNNER_TEMP/nextest-mutants.toml"
          printf '%s\n' '[profile.default]' 'slow-timeout = { period = "40s", terminate-after = 2 }' \
            '[[profile.default.overrides]]' "filter = 'package(stark-pca)'" 'slow-timeout = { period = "90s", terminate-after = 3 }' \
            '[[profile.default.overrides]]' "filter = 'package(pca-folding-ivc)'" 'slow-timeout = { period = "600s", terminate-after = 3 }' \
            '[[profile.default.overrides]]' "filter = 'binary(fuzz_decoder) | (package(atlas-pca) & test(/^fuzz_decoder::/))'" 'threads-required = "num-test-threads"' > "$NXC"
          cat "$NXC"
          { echo "MEMEV=$MEMEV"; echo "CARRY_ULIMIT_KB=$CARRY_ULIMIT_KB"; echo "NXC=$NXC"; echo "SCOPE_PROPS=${props[*]}"; echo "RUSTFLAGS=${RUSTFLAGS:-}"; } >> "$GITHUB_ENV"
      - name: Decide the slice (reaching tests first, then the full suite for anything not caught)
        run: |
          "$MONO/tools/pca-audit/rust-mutate/inscope.sh" node "$MONO/tools/pca-audit/rust-mutate/schema-run.mjs" --bundle="$RUNNER_TEMP/bundle" \
            --run=${{ matrix.r }} --runs=${{ matrix.runs }} --out="$RUNNER_TEMP/sres" --run-errors="$RUNNER_TEMP/sres/run-errors.json" \
            -j=2 --min-timeout=60 --multiplier=5 -- --config-file "$NXC"
          # every cgroup OOM kill must show as a SIGKILLed test in some outcome, as in the shards
          node -e '
            const fs = require("fs"), T = process.env.RUNNER_TEMP, s = Number(fs.readFileSync(T + "/sres/sigkilled.txt", "utf8"));
            if (!process.env.MEMEV) process.exit(0);
            if (!fs.existsSync(process.env.MEMEV)) { console.error("::error::the memory scope left no memory.events"); process.exit(1); }
            const k = Number((/^oom_kill (\d+)$/m.exec(fs.readFileSync(process.env.MEMEV, "utf8")) || [])[1] || 0);
            console.log(`cgroup oom_kill ${k}, ${s} outcome(s) with a SIGKILLed test`);
            if (k > 0 && s === 0) { console.error("::error::" + k + " OOM kill(s) in the memory scope that no outcome shows as a SIGKILLed test"); process.exit(1); }
          '
          rm -rf "$RUNNER_TEMP/sres/logs"
      - uses: actions/upload-artifact@v4
        with:
          name: sres-${{ matrix.key }}-${{ matrix.g }}-${{ matrix.r }}
          path: ${{ runner.temp }}/sres/

  # the shard matrix: a schema crate's fallback mutants and samples (schema-collect.mjs fbplan) plus the proof crates' shards
  fbplan:
    if: ${{ !cancelled() && needs.schema.result == 'success' }}
    needs: [reuse, plan, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - uses: actions/download-artifact@v4
        with:
          name: mut-list
          path: mut-list
      - uses: actions/download-artifact@v4
        with:
          pattern: dec-*
          path: decs
      - id: m
        run: node "$MONO/tools/pca-audit/rust-mutate/schema-collect.mjs" fbplan --list=mut-list --decs=decs --crates="$CRATES" --run-id="$GITHUB_RUN_ID" --names-out=fb-names >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fb-names
          path: fb-names/

  # exactly one decision per planned mutant of the schema crate, the samples identical both ways; then its two report shards
  collect:
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    needs: [reuse, plan, schema, run, fbplan, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEY: ${{ fromJSON(needs.plan.outputs.scrate).key }}
      DIR: ${{ fromJSON(needs.plan.outputs.scrate).dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - uses: actions/download-artifact@v4
        with:
          name: mut-list
          path: mut-list
      - uses: actions/download-artifact@v4
        with:
          pattern: dec-*
          path: decs
      - uses: actions/download-artifact@v4
        with:
          pattern: sres-*
          path: sres
      - uses: actions/download-artifact@v4
        with:
          pattern: fres-${{ env.KEY }}-*
          path: fres
      - name: Collect
        run: |
          node "$MONO/tools/pca-audit/rust-mutate/schema-collect.mjs" collect --list=mut-list --decs=decs --sres=sres --fres=fres --dir="$DIR" --key="$KEY" --out=col
          for k in 1 2; do
            node .github/scripts/mutation-shard-report.mjs --crate="$KEY" --shard=$k --of=2 --tool=cargo-mutants \
              --counts=col/counts-$k.json --survivors=col/survivors-$k.json --out=col/shard-$k.json
            mkdir -p "out-$k"; cp col/shard-$k.json col/run-errors-$k.json "out-$k/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ env.KEY }}-1
          path: out-1/
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ env.KEY }}-2
          path: out-2/
      - uses: actions/upload-artifact@v4
        with:
          name: mut-results-${{ env.KEY }}-all
          path: col/mut-results/
          retention-days: 30

  # Code the Linux shards never compile: the files of modules declared under #[cfg(windows)] / #[cfg(not(unix))] (CRATES `win`; the
  # file guard checks that list against the tree). cargo-mutants and stmt-mut mutate source text without evaluating cfg, so on Linux
  # every mutant of these files would build unchanged and survive: the Linux plan leaves them out, and here BOTH tools mutate them,
  # each mutant judged by the tests that exercise it (no ledger: every mutant must be caught). Each job uploads a winonly-* report
  # (file, tool, shard k/n, the slice's planned count, this shard's list, outcomes, survivors); the merge checks that every file has
  # every shard of both tools and no Linux result (win-only-check.mjs) and counts these mutants once, from here. A slice must name a
  # file that holds only Windows-compiled code (a Unix arm in the same file would survive as unbuilt). macOS has no macOS-only Rust
  # code (no cfg(target_os) anywhere in the crate).
  # Cost: cargo-mutants' build phase is `cargo nextest run --no-run` with --cargo-arg only (the args after `--` reach the test phase
  # alone), so a slice that named its tests after `--` rebuilt and relinked all ~290 integration test binaries for every mutant, and
  # with -j2 the second worker copied the tree and rebuilt every dependency too (run 45813609817: 609-809 s baselines, 1004 s for
  # one mutant, three slices cut at 60 min). Now the slice's test targets reach the build as well (--cargo-arg; stmt-run passes its
  # nextest args to both), both tools work in place (one target/: dependencies built once by the baseline, CARGO_INCREMENTAL=1
  # reuses the crate's unchanged codegen units), and a slice is split into k/n shards so each job stays well inside the limit.
  windows:
    name: windows-only ${{ matrix.slice }} ${{ matrix.tool }} ${{ matrix.k }}/${{ matrix.n }}
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # the win module (DACL file/dir creation, tightening; private_file.rs keeps the Unix arms): ~40 + ~15 mutants
          - { slice: private_file, file: '**/private_file_windows.rs', tool: cm, targets: '--lib', features: '', k: 0, n: 6 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: cm, targets: '--lib', features: '', k: 1, n: 6 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: cm, targets: '--lib', features: '', k: 2, n: 6 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: cm, targets: '--lib', features: '', k: 3, n: 6 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: cm, targets: '--lib', features: '', k: 4, n: 6 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: cm, targets: '--lib', features: '', k: 5, n: 6 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: stmt, targets: '--lib', features: '', k: 0, n: 2 }
          - { slice: private_file, file: '**/private_file_windows.rs', tool: stmt, targets: '--lib', features: '', k: 1, n: 2 }
          # MoveFileExW write-through replace (its own file: durable_rename.rs holds the Unix arms, which Windows never compiles)
          - { slice: durable_rename, file: '**/durable_rename_windows.rs', tool: cm, targets: '--lib', features: '', k: 0, n: 1 }
          - { slice: durable_rename, file: '**/durable_rename_windows.rs', tool: stmt, targets: '--lib', features: '', k: 0, n: 1 }
          # the whole non-Unix durable-state stub (lib.rs swaps it in for durable_state.rs): 15 mutants (12 unviable)
          - { slice: durable_state_stub, file: '**/durable_state_stub.rs', tool: cm, targets: '--lib --test durable_state_stub_windows', features: '', k: 0, n: 2 }
          - { slice: durable_state_stub, file: '**/durable_state_stub.rs', tool: cm, targets: '--lib --test durable_state_stub_windows', features: '', k: 1, n: 2 }
          - { slice: durable_state_stub, file: '**/durable_state_stub.rs', tool: stmt, targets: '--lib --test durable_state_stub_windows', features: '', k: 0, n: 1 }
          # cfg(not(unix)) exit-status arm of the crash-after-admission worker (its own file); only the cross-process SQLite
          # conformance test spawns and kills workers (tests/store_conformance.rs never reaches it)
          - { slice: killed_by_signal, file: '**/store_conformance_not_unix.rs', tool: cm, targets: '--test ref_state_guard', features: 'sqlite', k: 0, n: 1 }
          - { slice: killed_by_signal, file: '**/store_conformance_not_unix.rs', tool: stmt, targets: '--test ref_state_guard', features: 'sqlite', k: 0, n: 1 }
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full shared corpus from the flagship
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
        env:
          IN_REPO: '1'
      - name: Statement mutator (stmt-mut), built as the Linux shards build it
        if: ${{ matrix.tool == 'stmt' }}
        run: |
          cargo build -q --release --manifest-path "$MONO/tools/pca-audit/rust-mutate/stmt-mut/Cargo.toml" --target-dir "$RUNNER_TEMP/stmt-mut-target"
          echo "STMT_TOOL=$RUNNER_TEMP/stmt-mut-target/release/stmt-mut.exe" >> "$GITHUB_ENV"
      - name: Mutate
        id: mutate
        env:
          FILE: ${{ matrix.file }}
          TARGETS: ${{ matrix.targets }}
          FEATURES: ${{ matrix.features }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
        run: |
          ft=(); [ -z "$FEATURES" ] || ft=(--features "$FEATURES")
          sel=(-p atlas-pca --file "$FILE" "${ft[@]}")
          # a Windows-only file with no cargo-mutants mutant is a plan error, not a pass (the file guard holds the same rule)
          cargo mutants "${sel[@]}" --list > "$RUNNER_TEMP/all.txt"
          [ -s "$RUNNER_TEMP/all.txt" ] || { echo "::error::no mutants generated for ${{ matrix.slice }} on Windows"; exit 1; }
          rc=0
          if [ "${{ matrix.tool }}" = cm ]; then
            cargo mutants "${sel[@]}" --shard "$K/$N" --sharding round-robin --list > "$RUNNER_TEMP/list.txt"
            echo "planned=$(wc -l < "$RUNNER_TEMP/all.txt")" >> "$GITHUB_OUTPUT"
            echo "listed=$(wc -l < "$RUNNER_TEMP/list.txt")" >> "$GITHUB_OUTPUT"
            echo "cargo-mutants: $(wc -l < "$RUNNER_TEMP/list.txt") of $(wc -l < "$RUNNER_TEMP/all.txt") (shard $K/$N)"; cat "$RUNNER_TEMP/list.txt"
            ca=(); for a in $TARGETS; do ca+=("--cargo-arg=$a"); done
            # the Linux shards' profile (no debug info, optimized dependencies): the default debug build of every test binary
            # overran the PDB limit (LNK1140) and the disk (LNK1180); the test targets are named for the build and the test phase
            cargo mutants "${sel[@]}" --shard "$K/$N" --sharding round-robin --in-place --profile mutants --test-tool nextest \
              "${ca[@]}" --minimum-test-timeout 60 --output "$RUNNER_TEMP/out" || rc=$?
          else
            S="$MONO/tools/pca-audit/rust-mutate/stmt-run.mjs"
            node "$S" list --tool="$STMT_TOOL" --pkg=atlas-pca --file="$FILE" --features="$FEATURES" > "$RUNNER_TEMP/stmt.json"
            node -e '
              const p = require(process.argv[1]), k = +process.env.K, n = +process.env.N;
              const mine = p.mutants.filter((_, i) => i % n === k);
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `planned=${p.count}\nlisted=${mine.length}\n`);
              console.log(`statement mutants: ${mine.length} of ${p.count} (shard ${k}/${n})`); for (const m of mine) console.log(m.name);
            ' "$RUNNER_TEMP/stmt.json"
            # $TARGETS unquoted on purpose: one nextest argument per word
            node "$S" run --tool="$STMT_TOOL" --pkg=atlas-pca --file="$FILE" --features="$FEATURES" --in-place --shard="$K" --of="$N" \
              --out="$RUNNER_TEMP/out" --run-errors="$RUNNER_TEMP/run-errors.json" --min-timeout=60 --multiplier=5 -- --cargo-profile mutants $TARGETS || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 / 2 (missed) / 3 (timeout) are results, reported below; anything else is a tool failure
          case $rc in 0|2|3) ;; *) echo "::error::the mutation tool failed (exit $rc)"; exit "$rc" ;; esac
      - name: Report (winonly-*, for the merge)
        env:
          FILE: ${{ matrix.file }}
          SLICE: ${{ matrix.slice }}
          TOOL: ${{ matrix.tool }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
          PLANNED: ${{ steps.mutate.outputs.planned }}
          LISTED: ${{ steps.mutate.outputs.listed }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), d = path.join(process.env.RUNNER_TEMP, "out", "mutants.out"), pre = "crates/atlas-pca/";
            const norm = (s) => s.split("\\").join("/");
            const rd = (f) => fs.existsSync(path.join(d, f)) ? fs.readFileSync(path.join(d, f), "utf8").split("\n").filter(Boolean).map(norm) : [];
            const counts = { caught: rd("caught.txt").length, missed: rd("missed.txt").length, timeout: rd("timeout.txt").length, unviable: rd("unviable.txt").length };
            const want = process.env.FILE.replace(/^\*\*\//, "");
            const src = new Map(); const line = (f, n) => { if (!src.has(f)) src.set(f, fs.readFileSync(f, "utf8").split("\n")); return (src.get(f)[n - 1] || "").trim(); };
            let file = "";
            const parse = (l) => {
              const m = /^(.+?):(\d+):(\d+): (.*)$/.exec(l); if (!m) throw new Error("unparsed: " + l);
              if (!m[1].startsWith(pre) || !m[1].endsWith("/" + want)) throw new Error("mutant outside the slice file " + want + ": " + l);
              file = m[1].slice(pre.length); return m;
            };
            for (const k of ["caught", "missed", "timeout", "unviable"]) rd(k + ".txt").forEach(parse);
            const surv = [...rd("missed.txt"), ...rd("timeout.txt")].map((l) => { const m = parse(l); return { crate: process.env.CRATE, file: m[1].slice(pre.length), mutant: m[4], line: line(m[1], +m[2]), lineno: +m[2] }; });
            for (const s of surv) console.log(`::error::SURVIVED on Windows: ${s.file}:${s.lineno} ${s.mutant}`);
            const r = { crate: process.env.CRATE, os: "windows", tool: process.env.TOOL === "cm" ? "cargo-mutants" : "stmt", file: file || "src/" + want,
              k: +process.env.K, n: +process.env.N, planned: +process.env.PLANNED, listed: +process.env.LISTED, counts, survivors: surv };
            fs.writeFileSync(`winonly-${process.env.SLICE}-${process.env.TOOL}-${process.env.K}.json`, JSON.stringify(r, null, 1));
            console.log(JSON.stringify({ file: r.file, tool: r.tool, shard: `${r.k}/${r.n}`, planned: r.planned, listed: r.listed, counts }));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: winonly-${{ env.CRATE }}-${{ matrix.slice }}-${{ matrix.tool }}-${{ matrix.k }}
          path: winonly-${{ matrix.slice }}-${{ matrix.tool }}-${{ matrix.k }}.json
      - name: Every mutant caught
        if: ${{ steps.mutate.outputs.rc != '0' }}
        run: |
          cat "$RUNNER_TEMP"/out/mutants.out/missed.txt "$RUNNER_TEMP"/out/mutants.out/timeout.txt 2>/dev/null || true
          echo "::error::Windows-only mutants survived (exit ${{ steps.mutate.outputs.rc }}); there is no ledger on Windows"
          exit 1

  merge:
    name: merge ${{ matrix.key }}
    needs: [reuse, plan, snapshot, shard, windows, collect]
    if: ${{ needs.reuse.outputs.skip != 'true' && (always() && needs.plan.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.crates) }}
    env:
      KEY: ${{ matrix.key }}
      DIR: ${{ matrix.dir }}
      SHARDS: ${{ matrix.of }}
    steps:
      # the shards do not wait for the snapshot job, so its file guard can only fail the gate here
      - name: The file guard passed
        if: needs.snapshot.result != 'success'
        run: |
          echo "::error::the snapshot job, which holds the file guard, did not pass: ${{ needs.snapshot.result }}"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship checker + ledger
        run: .github/scripts/mutation-layout.sh "$CRATE" crates/atlas-pca
      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: shard-${{ matrix.key }}-*
      - uses: actions/download-artifact@v4
        with:
          name: mut-plan
          path: mut-plan
      # the racy run-error entries below may match 0 only when the mutant was generated AND plainly killed in this run
      - uses: actions/download-artifact@v4
        with:
          path: mut-res
          pattern: mut-results-${{ matrix.key }}-*
      # the Windows-only files' reports (the windows job); a failed or cancelled Windows job leaves a report missing, which the
      # check below refuses
      - uses: actions/download-artifact@v4
        if: ${{ matrix.win != '' }}
        with:
          path: reports
          pattern: winonly-${{ matrix.key }}-*
      - name: Every planned mutant is reported (with a negative control)
        run: node "$MONO/tools/pca-audit/rust-mutate/plan-check.mjs" --reports=reports --plan="mut-plan/$KEY.json" --shards="$SHARDS"
      - name: Windows-only files mutated on Windows by both tools, every shard, none on Linux (with a negative control)
        if: ${{ !cancelled() && matrix.win != '' }}
        run: |
          node "$MONO/tools/pca-audit/rust-mutate/win-only-check.mjs" --self-test
          node "$MONO/tools/pca-audit/rust-mutate/win-only-check.mjs" --reports=reports --crate="$KEY" --win="${{ matrix.win }}"
      - name: Merge shards and check the ledger
        if: ${{ !cancelled() }}
        run: >
          node .github/scripts/mutation-merge.mjs --crate="$KEY" --shards="$SHARDS" --reports=reports
          --checker="$MONO/tools/pca-audit" --src="$GITHUB_WORKSPACE/$DIR"
      # gate honesty: a run-error mutant (its tests died by a signal: OOM kill, failed allocation, stack overflow) was counted
      # caught though no test decided it. Each must be in mutation-run-errors.json with a proof that the mutant itself causes
      # it (the unmutated suite passes under the same caps: cargo-mutants' baseline run); an unlisted one or a stale entry fails.
      # An entry marked racy may also match 0 only if its mutant was generated and plainly caught in this run (mut-results).
      - name: Run errors (signal-killed tests) and timeouts are each proven mutant-caused
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const got = []; let shards = 0;
            const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (/^run-errors-\d+\.json$/.test(e.name)) { shards++; got.push(...JSON.parse(fs.readFileSync(p, "utf8"))); } } };
            walk("reports");
            const want = Number(process.env.SHARDS);
            if (shards !== want) { console.error(`::error::run-error lists from ${shards}/${want} shards (a missing list is a failure)`); process.exit(1); }
            const led = JSON.parse(fs.readFileSync(process.env.DIR + "/mutation-run-errors.json", "utf8"));
            const key = (m) => [m.file, m.fn, m.text, m.mutant].join(" | ");
            const res = []; const rw = (d) => { for (const x of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, x.name); if (x.isDirectory()) rw(p); else if (x.name === "results.json") res.push(...JSON.parse(fs.readFileSync(p, "utf8"))); } };
            if (fs.existsSync("mut-res")) rw("mut-res");
            const srcLines = new Map(); const srcLine = (f, n) => { if (!srcLines.has(f)) srcLines.set(f, fs.existsSync(f) ? fs.readFileSync(f, "utf8").split("\n") : []); return (srcLines.get(f)[n - 1] || "").trim(); };
            const pre = process.env.DIR + "/";
            const killedCount = (e) => res.filter((r) => { const m = r.status === "caught" && /^(.+?):(\d+):\d+: (.*)$/.exec(r.name || ""); if (!m) return false; const f = m[1].startsWith(pre) ? m[1].slice(pre.length) : m[1]; return f === e.file && m[3] === e.mutant && srcLine(path.join(process.env.DIR, f), +m[2]) === e.text; }).length;
            const have = new Map(); for (const m of got) have.set(key(m), (have.get(key(m)) || 0) + 1);
            let bad = 0; const used = new Set();
            for (const e of led) {
              if (!e.reason) { console.error("::error::run-error ledger entry without a reason: " + key(e)); bad++; }
              // a timeout entry proves the MUTANT does not terminate (e.g. a loop counter that no longer advances); the unmutated
              // suite passing within the same limit is the baseline of the shard
              if (e.kind === "timeout" && !(typeof e.proof === "string" && e.proof.trim())) { console.error("::error::timeout ledger entry without a proof: " + key(e)); bad++; }
              const n = have.get(key(e)) || 0, k = e.multiplicity || 1;
              // racy: some of the k sites may be plainly caught instead of erroring (a test FAILs before another overflows); then every site
              // must be accounted for: n run errors + matching mutants plainly caught this run (same file, mutant text and source line)
              // >= k, and n <= k. A mutant that was not generated is a stale entry. A non-racy entry covers exactly k.
              if (e.racy === true) {
                const kc = killedCount(e);
                if (n > k || n + kc < k) { console.error(`::error::racy run-error ledger entry covers ${k}: ${n} run error(s) + ${kc} plainly caught this run (not generated, or not killed): ${key(e)}`); bad++; }
              } else if (n !== k) { console.error(`::error::run-error ledger entry covers ${k}, the run has ${n}: ${key(e)}`); bad++; }
              const src = path.join(process.env.DIR, e.file);
              if (!fs.existsSync(src) || !fs.readFileSync(src, "utf8").split("\n").some((l) => l.trim() === e.text)) { console.error("::error::run-error ledger entry whose line is gone (stale): " + key(e)); bad++; }
              used.add(key(e));
            }
            for (const [k, n] of have) if (!used.has(k)) { const g = got.find((m) => key(m) === k); console.error(`::error::UNPROVEN ${g.kind === "timeout" ? "timeout" : "run error"} (x${n}, ${g.kind}${g.evidence ? ", " + g.evidence : ""}), no test decided it: ${k}`); bad++; }
            console.log(`${got.length} run-error mutant(s) over ${shards} shards, ${led.length} ledger entries, ${bad} problem(s)`);
            process.exit(bad ? 1 : 0);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivors-merged-${{ matrix.key }}
          path: reports/survivors-merged.json
          if-no-files-found: ignore
      - name: Merge result for the release evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # the release evidence report reads `mutation-summary` (atlas-pca); the proof crates' carry their key
          name: ${{ matrix.key == 'rust-pca' && 'mutation-summary' || format('mutation-summary-{0}', matrix.key) }}
          path: reports/mutation-summary.json
          if-no-files-found: ignore

  reuse-record:
    name: reuse record
    needs: [reuse, snapshot, plan, natives, schema, run, fbplan, shard, collect, merge, windows]
    # only a run whose jobs all passed (skipped by their own conditions is fine), that was not partial and not itself a reuse, leaves a record
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' && needs.reuse.outputs.hash != '' && !(false) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: rec
        env:
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          HASH: ${{ needs.reuse.outputs.hash }}
        run: node .github/scripts/ci-reuse.mjs record --workflow=mutation --hash="$HASH" --out="$RUNNER_TEMP/reuse-record"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rec.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-record/
          retention-days: 21
