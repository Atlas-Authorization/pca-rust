        run: |
          df -h "$RUNNER_TEMP" | tail -1
          if command -v mold >/dev/null; then export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-fuse-ld=mold"; echo "linker: mold"; else echo "linker: default (no mold)"; fi
