            '[[profile.default.overrides]]' "filter = 'package(stark-pca)'" 'slow-timeout = { period = "90s", terminate-after = 3 }' \
            '[[profile.default.overrides]]' "filter = 'package(pca-folding-ivc)'" 'slow-timeout = { period = "600s", terminate-after = 3 }' \
            '[[profile.default.overrides]]' "filter = 'binary(fuzz_decoder) | (package(atlas-pca) & test(/^fuzz_decoder::/))'" 'threads-required = "num-test-threads"' > "$NXC"
