name: CI

# The Cargo workspace (atlas-pca verifier, stark-pca, folding-pca): build + every test, incl. the shared conformance
# corpus (crates/atlas-pca/tests/conformance.rs over conformance/vectors.json). zkvm-pca is its own workspace: its
# core + receipt-verifier crates are tested here against committed receipts/fixtures (proving is not run in CI).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  workspace:
    name: workspace (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Full shared corpus from the flagship (adversarial set; tables the zkvm tests include by source path)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --release --features atlas-pca/less
      - name: Tests (all crates) + conformance corpus
        run: cargo test --workspace --release --no-fail-fast --features atlas-pca/less
      # the vendor attestation verifiers (AMD SEV-SNP, Intel TDX, Azure MAA, GCP Confidential Space, NVIDIA): the evidence-vector
      # file comes with the flagship corpus above; a missing file fails the tests, it never skips them
      # rules 20-21 and the ternary decision: packages/pca/conformance/decision-vectors.json (a missing file fails, never skips)
      - name: Decision vectors (units, tighten-only, decision lattice, multi-check fold, escalation answers under every suite, rules 20-21 end to end)
        run: |
          test -s packages/pca/conformance/decision-vectors.json
          test -s packages/pca/conformance/model-rules-vectors.json
          cargo test -p atlas-pca --release --test decision_conformance --test escalation --test model_rules
      # provenance by default (check provenance_flow, on by default in authorize) and undo windows (pure layer, the undo_window
      # obligation, the admission hook in authorize and the guard): arg-provenance-vectors.json and undo-vectors.json
      # (a missing file fails, never skips)
      - name: Provenance by default and undo windows (arg-provenance and undo vectors, the default-on gate, undo admission)
        run: |
          test -s packages/pca/conformance/arg-provenance-vectors.json
          test -s packages/pca/conformance/undo-vectors.json
          cargo test -p atlas-pca --release --test arg_provenance --test undo_vectors --test provenance_flow
          cargo test -p atlas-pca --release --features axum --test provenance_flow --test authorize
      # the agent / issuer side: packages/pca/conformance/producer-vectors.json (fixed keys, exact outputs; a missing file fails, never skips)
      - name: Agent / issuer side (producer vectors byte for byte, round trips, ML-DSA hybrids)
        run: |
          test -s packages/pca/conformance/producer-vectors.json
          cargo test -p atlas-pca --release --test agent_producer
          cargo test -p atlas-pca --release --features fndsa-sign --test agent_producer
      # caveat language v2: packages/pca/conformance/caveat-lang-vectors.json (a missing file fails, never skips)
      - name: Caveat language v2 vectors (discharges, K1 evaluation, shapes, use slots, SPIFFE IDs, authorize integration)
        run: |
          test -s packages/pca/conformance/caveat-lang-vectors.json
          cargo test -p atlas-pca --release --test caveat_lang_vectors
      - name: Forbid-wins certificate and linked policy template vectors (a missing file fails, never skips)
        run: |
          test -s packages/pca/conformance/forbid-certificate-vectors.json
          test -s packages/pca/conformance/policy-link-vectors.json
          cargo test -p atlas-pca --release --test policy_authoring
      # operational plane (policy bundles, decision log, list-authorized, grant management) and the fresh_at PCActn member:
      # packages/pca/conformance/k3-vectors.json and fresh-at-vectors.json (a missing file fails, never skips)
      - name: K3 operational-plane vectors and the fresh_at member
        run: |
          test -s packages/pca/conformance/k3-vectors.json
          test -s packages/pca/conformance/fresh-at-vectors.json
          test -s packages/pca/conformance/pca-grant-vectors.json
          test -s packages/pca/conformance/blueprint-vectors.json
          test -s packages/pca/conformance/k4-vectors.json
          test -s packages/pca/conformance/a2a-vectors.json
          cargo test -p atlas-pca --release --test k3_vectors --test fresh_at_vectors --test pca_grant_vectors --test blueprint_vectors --test a2a_vectors --test k4_vectors
          test -s packages/pca/conformance/workflow-vectors.json
          test -s packages/pca/conformance/readside-vectors.json
          test -s packages/pca/conformance/vault-aggregate-vectors.json
          test -s packages/pca/conformance/authorize-workflow-fixtures.json
          cargo test -p atlas-pca --release --test k3_vectors --test fresh_at_vectors --test pca_grant_vectors --test blueprint_vectors --test a2a_vectors --test k5_vectors --test authorize_workflow_fixtures
          test -s packages/pca/conformance/lease-vectors.json
          test -s packages/pca/conformance/obligations-vectors.json
          test -s packages/pca/conformance/break-glass-vectors.json
          test -s packages/pca/conformance/missing-context-vectors.json
          test -s packages/pca/conformance/policy-classes-vectors.json
          cargo test -p atlas-pca --release --test k3_vectors --test fresh_at_vectors --test pca_grant_vectors --test blueprint_vectors --test a2a_vectors --test lease_vectors --test obligations_vectors --test break_glass_vectors --test missing_context_vectors --test policy_classes_vectors
          test -s packages/pca/conformance/provenance-vectors.json
          test -s packages/pca/conformance/sigstore-vectors.json
          cargo test -p atlas-pca --release --test k3_vectors --test fresh_at_vectors --test pca_grant_vectors --test blueprint_vectors --test a2a_vectors --test provenance_vectors --test sigstore_vectors
      - name: Vendor attestation verifiers (primitives, fail-closed table, evidence vectors, passport vendor rows)
        run: |
          test -f packages/pca/conformance/attestation-evidence-vectors.json
          cargo test -p atlas-pca --release --test attest_primitives --test attest_failclosed --test attestation_vectors
          cargo test -p atlas-pca --release --test passport_conformance passport_hardware_vectors

      # native-parity vectors (goal binding v3, revocation staleness): a missing file fails, never skips
      - name: Native parity (goal-commit v3, revocation staleness vectors and the authorize gate)
        run: |
          test -s packages/pca/conformance/goal-commit-vectors.json
          test -s packages/pca/conformance/staleness-vectors.json
          cargo test -p atlas-pca --release --lib -- goal_commit_test staleness_test
          cargo test -p atlas-pca --release --test staleness_authorize
      - name: Native parity (operation records, plan lifecycle, concurrency, durable SQLite store)
        run: |
          test -s packages/pca/conformance/operation-vectors.json
          test -s packages/pca/conformance/plan-vectors.json
          cargo test -p atlas-pca --release --test operation_records --test plan_lifecycle
          cargo test -p atlas-pca --release --features sqlite --test sqlite_kv
          cargo test -p atlas-pca --release --test store_conformance
      - name: Native parity (assurance labels, report, requirement gate, multi-root level, bond unsupported)
        run: |
          test -s packages/pca/conformance/assurance-vectors.json
          cargo test -p atlas-pca --release --test assurance_vectors
          cargo test -p atlas-pca --release --features axum --test middleware_operations --test fresh_at_guard --test middleware_workflow
      - name: Step-up client (device key, ISO times, list / approve / deny over a scripted transport)
        run: cargo test -p atlas-pca --release --test stepup
      - name: protect() and explain_refusal (secure defaults, revocation, the doc link in refusal bodies)
        run: cargo test -p atlas-pca --release --features axum --test protect --test refusal_help --test mutation_kill_middleware

  # The runnable axum example (its own workspace, outside the published crate): build and run its end-to-end test.
  example-axum-server:
    name: example axum-server (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/atlas-pca/examples/axum-server
      - name: Build
        working-directory: crates/atlas-pca/examples/axum-server
        run: cargo build --release
      - name: Smoke test (valid proof allowed once, replay and missing proof refused with a doc link)
        working-directory: crates/atlas-pca/examples/axum-server
        run: cargo test --release

  # Action kit: the shared action vectors (conformance/actions) replayed byte for byte; a missing directory fails, never skips.
  actions-vectors:
    name: actions-vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Action vectors (parse, digest, expand, floor, conform, pack, schema_verb, effective)
        shell: bash
        run: |
          test -d conformance/actions
          cargo test -p atlas-pca --release --test actions_vectors

  verifier:
    name: atlas-pca (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Full shared corpus from the flagship (adversarial set; tables the zkvm tests include by source path)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests + conformance corpus (LESS via the crate's copy of the reference C, not on Windows)
        shell: bash
        run: cargo test -p atlas-pca --no-fail-fast $([ "$RUNNER_OS" = Windows ] || echo --features less)

  zkvm-verify:
    name: zkvm-pca core + receipt verifier
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Full shared corpus from the flagship (adversarial set; tables the zkvm tests include by source path)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/zkvm-pca
      - name: Tests (core + verify; no proving, the guest is not built)
        working-directory: crates/zkvm-pca
        env:
          RISC0_SKIP_BUILD: '1'
        run: cargo test --locked --release --no-fail-fast -p pca-zkvm-core -p pca-zkvm-verify

  maturity:
    name: every published package declares its maturity tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # tier in every manifest, a matching "Maturity:" line in every README header, experimental said where it applies
      - run: node .github/scripts/maturity-check.mjs
