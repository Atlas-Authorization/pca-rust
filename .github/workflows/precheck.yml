name: Precheck

# Compile-only gate, cargo check --all-targets for the workspace, every opt-in feature, the zkvm workspace and the example server.
# Runs only on pre/** pushes (and by hand): it builds and typechecks everything, tests included, and runs no test.
# Push pre/<version> first and the full ci/** run only when this is green.
on:
  push:
    branches: ['pre/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5" # SEAL's bundled zlib declares cmake_minimum_required below 3.5; CMake 4 rejects that
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  precheck:
    name: cargo check --all-targets (tests, examples, opt-in features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Full shared corpus from the flagship (the tests include tables by source path)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$(pwd)/crates/atlas-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$(pwd)/crates/atlas-pca/test-data" oprf:oprf mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe-go core-frost-java:core-frost-java frost-dkg:frost-dkg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo.lock covers every dependency
        id: c0
        continue-on-error: true
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null && cargo metadata --locked --format-version 1 > /dev/null
      - name: Workspace, every target, with the less feature
        id: c1
        continue-on-error: true
        run: cargo check --workspace --all-targets --features atlas-pca/less
      - name: Workspace, every target, default features
        id: c2
        continue-on-error: true
        run: cargo check --workspace --all-targets
      - name: Feature sets the other workflows use (zk, axum, sqlite, mpc-net-driver, fndsa-sign)
        id: c3
        continue-on-error: true
        run: |
          rc=0
          for f in zk axum sqlite mpc-net-driver fndsa-sign; do
            cargo check -p atlas-pca --all-targets --features "$f" || { echo "::error::feature $f failed"; rc=1; }
          done
          exit $rc
      - name: Example server
        id: c4
        continue-on-error: true
        working-directory: crates/atlas-pca/examples/axum-server
        run: cargo check --all-targets
      - name: zkvm workspace (core and verifier; the guest is not built)
        id: c5
        continue-on-error: true
        working-directory: crates/zkvm-pca
        env:
          RISC0_SKIP_BUILD: '1'
        run: cargo check --locked --all-targets -p pca-zkvm-core -p pca-zkvm-verify
      # every optional module at once (fhe-seal, mpc-endemic, sandbox-wasm, actix, ...): the crate with its path dependencies in the source layout
      - name: Source layout for the opt-in modules
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono rust-pca
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PCA_MONO_SDK }}
      # the fhe-seal-vendored feature builds SEAL from the sources the published package ships; a git checkout fetches them first
      - name: SEAL sources for the fhe-seal-vendored feature
        shell: bash
        run: .github/scripts/fetch-seal-vendor.sh "$PCA_MONO_SDK/crates/atlas-pca/seal-src"
      - name: atlas-pca, every target, all features
        id: c6
        continue-on-error: true
        working-directory: ${{ env.PCA_MONO_SDK }}/crates/atlas-pca
        run: cargo check --all-targets --all-features
      # every check above runs even when an earlier one failed; this step makes the job red when any did
      - name: Summary
        if: ${{ always() && (steps.c0.outcome == 'failure' || steps.c1.outcome == 'failure' || steps.c2.outcome == 'failure' || steps.c3.outcome == 'failure' || steps.c4.outcome == 'failure' || steps.c5.outcome == 'failure' || steps.c6.outcome == 'failure') }}
        run: |
          echo "::error::one or more compile checks failed; each failing step above has the details"
          exit 1

  # the Windows and macOS code paths compile only for their own targets, and blst's C build cannot cross-compile from Linux to
  # either: check them on native runners, with the same corpus steps as the full run
  native:
    name: cargo check --all-targets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Full shared corpus from the flagship (the tests include tables by source path)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP corpus (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$(pwd)/crates/atlas-pca/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated by the TypeScript reference; never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$(pwd)/crates/atlas-pca/test-data" oprf:oprf mpc-ot:mpc-ot attest-eat:attest-eat abe-go:abe-go core-frost-java:core-frost-java frost-dkg:frost-dkg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: atlas-pca, every target, default features
        shell: bash
        run: cargo check -p atlas-pca --all-targets
